repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Format and lint through the repo's npm scripts — one prettier/eslint version
  # (node_modules, the same lint-staged uses at commit) instead of pinned mirrors.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (npm run format)
        entry: npm run format
        language: system
        pass_filenames: false
        files: '\.(ts|tsx|js|jsx|json|css|html|md|yml|yaml)$'
      - id: eslint
        name: eslint (npm run lint:fix)
        entry: npm run lint:fix
        language: system
        pass_filenames: false
        files: '\.(ts|tsx|js|jsx)$'
