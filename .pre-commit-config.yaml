# Hygiene suite, run in CI by the "Pre-commit" job (`pre-commit run --all-files`).
# Format and lint run at commit via lint-staged and in CI's Lint & Format job;
# secret scanning has its own CI job (gitleaks, .gitleaks.toml) — neither is
# duplicated here. Patch files are data, so whitespace hooks must not edit them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
