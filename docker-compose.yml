services:
  dono-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    image: ghcr.io/codescales/esa-dono-ui/backend:latest
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/data/dono.db
      # Stripe integration
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-usd}
      - CAMPAIGN_GOAL_CENTS=${CAMPAIGN_GOAL_CENTS:-500000}
      # Auth
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      - MODERATOR_API_KEY=${MODERATOR_API_KEY:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - MODERATOR_EMAILS=${MODERATOR_EMAILS:-}
      # Email (magic links). Omit SMTP_HOST to log links to stdout instead.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-Donation Platform <no-reply@example.com>}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
    volumes:
      - dono-data:/data
    restart: unless-stopped

  dono-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/codescales/esa-dono-ui/frontend:latest
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    depends_on:
      - dono-backend
    restart: unless-stopped

volumes:
  dono-data:
