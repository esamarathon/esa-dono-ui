              properties:
                amount_cents:
                  type: integer
                  description: Non-zero integer. Positive adds, negative subtracts.
                reason: { type: string }
                type:
                  type: string
                  enum: [REFUND, FREEZE_ZERO, MANUAL, CHARGEBACK]
      responses:
        '200':
          description: Balance adjusted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { enum: [true] }
                  email: { type: string }
                  balance_before: { type: integer }
                  balance_after: { type: integer }
                  adjustment: { type: object }

  /admin/donors/sweep-credits:
    post:
      tags: [Admin]
      summary: Bulk credit sweep-out (#60)
      description: |
        Zeros available Wallet credit (balance_remaining) ONLY; never touches balance_held_cents or category Pool credit. For every donor with positive available credit,
        optionally filtered to a balance range. Two-step confirmation:
        omit/false `confirm` for a dry-run preview (nothing written);
        `confirm: true` to actually perform the sweep. Each swept donor gets
        a FREEZE_ZERO BalanceAdjustment whose reason references the donor's
        most recent donation's self-reported donor_name (or "Anonymous").
      security: [{ AdminKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                min_balance_cents: { type: integer, minimum: 0 }
                max_balance_cents: { type: integer, minimum: 0 }
                confirm:
                  type: boolean
                  description: Must be true to actually perform the sweep; otherwise a preview is returned.
      responses:
        '200':
          description: Preview (confirm omitted/false) or sweep result (confirm true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview: { type: boolean, description: 'true only on the dry-run response' }
                  success:
                    { type: boolean, description: 'true only on the executed-sweep response' }
                  donor_count: { type: integer }
                  total_cents: { type: integer }
                  sample:
                    type: array
                    description: First 10 matching donors (preview only)
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        balance_remaining: { type: integer }
                        donor_name: { type: string, nullable: true }
        '400':
          description: Invalid min_balance_cents/max_balance_cents

  /admin/donors/{id}/reverse-spend:
    post:
      tags: [Admin]
      summary: Reverse a claim, vote, or contribution
      description: >-
        Pooled donor/auto rows give category-bound Pool credit; moderator rows return
        computed Unused pool money. No Wallet adjustment is written for pooled rows.
        Legacy/unlinked rows credit their recorded amount as REFUND. Claims use their
        recorded price and restore stock. FULFILLED claims must first be marked PENDING.
        Every row linked to CHARGEBACK is blocked. REQUESTED Payment refunds block conflicts.
        Goal completion is recomputed from remaining allocated cents against its target.
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spend_type, spend_id]
              properties:
                spend_type:
                  type: string
                  enum: [claim, vote, contribution]
                spend_id: { type: string }
      responses:
        '200':
          description: Spend reversed

  /admin/polls:
    get:
      tags: [Admin]
      summary: List all polls
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: All polls with nested options. Rows have the Reward/Poll/FundGoal fields, including `event_id` and `channel_id`, plus allocation summaries.
    post:
      tags: [Admin]
      summary: Create a poll
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                is_active: { type: boolean, default: true }
                ends_at: { type: string, format: date-time, nullable: true }
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      label: { type: string }
                allow_custom_entries: { type: boolean, default: false }
                max_entry_chars: { type: integer, nullable: true }
                auto_approve: { type: boolean, default: true }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
                  description: |
                    Owning Event (ADR-0012). With channel_id it must be that Channel's Event.
                    Without channel_id (a shared incentive) it defaults to the only Event;
                    when two or more Events exist it is required.
      responses:
        '200':
          description: Poll created

  /admin/polls/{id}:
    put:
      tags: [Admin]
      summary: Update a poll
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                is_active: { type: boolean }
                ends_at: { type: string, format: date-time, nullable: true }
                allow_custom_entries: { type: boolean }
                max_entry_chars: { type: integer, nullable: true }
                auto_approve: { type: boolean }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
