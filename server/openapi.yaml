  /tiltify/campaign/{id}/lookup/rewards/{reward_id}:
    get:
      tags: [Tiltify]
      summary: Optional ESA reward lookup within an Event
      description: |
        ESA-only capability, not an ordinary Tiltify endpoint. The context id is a
        known Channel or Event, including inactive history. The reward must be
        shared or owned by a Channel in that same Event. Returns its true owner, the
        Channel UUID or the Event UUID for a shared reward (ADR-0012), and the exact
        existing bare reward DTO.
        Public and read-only; no donor, staff or private claim data. Does not widen
        existing lists, reassign donations or change resource ids.
      parameters:
        - name: id
          in: path
          required: true
          description: Context Channel or Event UUID (inactive identities still resolve)
          schema: { type: string, format: uuid }
        - name: reward_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owner and current public reward, including inactive rewards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsaDonoRewardLookup'
        '404':
          description: Unknown context or reward, or the reward owner belongs to another Event
        '429':
          description: Global API rate limit (RATE_LIMIT_API per minute per IP)

  /tiltify/campaign/{id}/lookup/targets/{target_id}:
    get:
      tags: [Tiltify]
      summary: Optional ESA target lookup within an Event
      description: |
        ESA-only capability, not an ordinary Tiltify endpoint. The context id is a
        known Channel or Event, including inactive history. The target must be
        shared or owned by a Channel in that same Event. Returns its true owner, the
        Channel UUID or the Event UUID for a shared target (ADR-0012), and the exact
        existing bare target DTO with
        current progress. Public and read-only; no donor or staff data. Existing
