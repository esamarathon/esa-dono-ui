  # ─── Pledge ───
  /pledge/default-goal/{channelId}:
    get:
      tags: [Pledge]
      summary: Read-only preview of the Channel's current default goal
      description: Uses the fulfillment resolver (own list, primary list, closest own/shared). No reservation; eligibility is checked again at payment completion. No donor data.
      parameters:
        - in: path
          name: channelId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current eligible goal, or null when no goal can take money
          content:
            application/json:
              schema:
                type: object
                required: [goal]
                properties:
                  goal:
                    type: object
                    nullable: true
                    required: [id, title]
                    properties:
                      id: { type: string }
                      title: { type: string }
        '404':
          description: Unknown or inactive Channel
        '429':
          description: Global API rate limit
  /pledge:
    post:
      tags: [Pledge]
      summary: Confirm an amount-first pooled pledge
      description: |
        Each reward, poll and goal Pool independently equals pledge_amount_cents.
        Anonymous requests are allowed. A valid donor session is resolved before
        planning; email alone never authorizes Wallet credit. Physical reward
        prices are funded by new money and shipping is a separate fee outside
        every Pool and money total. Positive Stripe charges are at least 50 cents.

        The client sends the exact plan returned by @dono/shared planPledge.
        A new attempt validates live Channel, stock, prices, eligibility and text.
        Category overage returns 400. A changed plan returns 409 with the corrected
        plan and items, creating neither a pledge nor a Wallet hold. Confirmed
        prices, types, auto rows and initial Wallet hold are stored atomically.
        Retrying an existing draft returns its immutable plan, including its own
        held funding, before comparison. Unknown attempts remain immutable.
        Stripe creation uses the pledge token as its idempotency key and the exact
        two-hour deadline, with distinct success/cancel returns and recovery disabled.
        Uncertain create returns this confirmed pledge with checkout_error; never
        assume a null Session id means no payment opportunity exists.

        Missing pledge_amount_cents or any top_up_cents returns 400 with
        "The donate page was updated. Reload to continue."
        Live removed/closed/foreign selections and reduced stock are returned for
        corrected review; no automatic increase to the pledge amount occurs.
      security: [{}, { DonorSession: [] }, { DonorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, channel_id, pledge_amount_cents, draft_id, plan]
              properties:
                pledge_amount_cents: { type: integer, minimum: 100, maximum: 2147483647 }
                draft_id: { type: string, minLength: 1, maxLength: 128 }
                plan: { $ref: '#/components/schemas/PledgePlan' }
                email:
                  type: string
                  format: email
                  description: Donor email (for Stripe pre-fill and magic link delivery)
                comment:
                  type: string
                  maxLength: 500
                display_name:
                  type: string
                  maxLength: 60
                  description: Optional public display name. Empty, whitespace-only or omitted means Anonymous (null donor_name); a confirmed blank never falls back to a payment-provider name.
                channel_id:
                  type: string
                  description: Required. The channel this donation is routed to.
                items:
                  type: array
                  minItems: 0
                  items:
                    type: object
                    required: [kind, target_id]
                    properties:
                      kind:
                        type: string
                        enum: [REWARD, POLL_VOTE, GOAL, POLL_CUSTOM]
                      target_id:
                        type: string
                        description: reward_id | poll_option_id | goal_id | poll_id (POLL_CUSTOM)
                      amount_cents:
                        type: integer
                        description: Required for POLL_VOTE, GOAL, POLL_CUSTOM (min 100)
                      poll_id:
                        type: string
                        description: Required for POLL_VOTE and POLL_CUSTOM
                      quantity:
                        type: integer
                        minimum: 1
                        default: 1
                        description: REWARD only — number of units of this reward to claim. amount_cents should be cost_cents * quantity (the line total, not the unit price). Ignored for other kinds.
                      insertion_order:
                        type: integer
                        minimum: 0
                        description: Tie order for largest remainders; defaults to array position.
                      data:
                        description: Claim data for REWARD, { label } for POLL_CUSTOM
      responses:
        '200':
          description: Confirmed pooled pledge (or the existing draft's immutable pledge)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PooledPledge' }
                  - type: object
                    required: [checkout_error]
                    properties:
                      checkout_error: { type: string, nullable: true }
        '400':
          description: Obsolete donate contract, missing draft/plan, invalid cents/text or category overage
        '403':
          description: The existing pledge's Wallet funding belongs to another donor session
        '404':
          description: Channel not found or inactive
        '409':
          description: Confirm the corrected review; no pledge or Wallet hold was created
          content:
            application/json:
              schema:
                type: object
                required: [error, plan, items]
                properties:
                  error: { type: string }
                  plan: { $ref: '#/components/schemas/PledgePlan' }
                  items: { type: array, items: { type: object } }

  /pledge/{token}:
    get:
      tags: [Pledge]
      summary: Get pledge status
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Immutable pledge details; LEGACY is read-only. Never exposes donor email or session tokens.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/PooledPledge' }
                  - { $ref: '#/components/schemas/LegacyPledge' }
                discriminator:
                  propertyName: format
        '404':
          description: Pledge not found

  /pledge/{token}/reconcile:
    post:
      tags: [Pledge]
      summary: Reconcile the exact Stripe Session and return the immutable review
      description: |
        Public token-bound operation; never authenticates the donor. Paid/complete
        fulfills once. Complete/unpaid remains PROCESSING with held funding.
        Only authoritative non-payment releases funding. Unknown state returns
        409 and blocks editing/new checkout. No local deadline releases funds.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PledgeState' }
        '404': { description: Pledge not found }
        '409': { $ref: '#/components/responses/PledgeReconciliationConflict' }

  /pledge/{token}/cancel:
    post:
      tags: [Pledge]
      summary: Expire then reconcile before allowing edits
      description: |
        A Wallet-bound pledge requires its owning donor session. A never-attempted
        checkout can be cancelled atomically. An uncertain create must first recover
        its Session identity; null id alone is not evidence. Expire errors trigger
        retrieval. Open/unknown outcomes return 409; complete/unpaid returns PROCESSING.
        Confirmed non-payment releases once. FULFILLED is never overwritten.
        LEGACY pledges are read-only (409).
      security: [{}, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PledgeState' }
        '403': { description: Wallet-bound pledge requires its owning donor session }
        '404': { description: Pledge not found }
        '409': { $ref: '#/components/responses/PledgeReconciliationConflict' }

  /pledge/{token}/continue:
    post:
      tags: [Pledge]
      summary: Continue the same confirmed checkout, never a new plan
      description: |
        Reconciles an existing attempt before returning a payable URL. Retrying an
        uncertain create reuses its exact request/key only within 24 hours. After
        that, identity must be discovered without another create. An unresolved
        lookup stays blocked. Terminal/processing pledges return no payable URL.
        A Wallet-bound pledge requires its owning donor session; LEGACY returns 409.
      security: [{}, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PledgeState' }
        '403': { description: Wallet-bound pledge requires its owning donor session }
        '404': { description: Pledge not found }
        '409': { $ref: '#/components/responses/PledgeReconciliationConflict' }
        '503': { description: Stripe is unavailable for a physical pledge }

  # ─── Webhook ───
  /webhooks/stripe:
    post:
      tags: [Webhook]
      summary: Stripe webhook receiver
      description: |
        Receives raw JSON body (mounted before `express.json()`).
        Handles checkout.session.completed, checkout.session.expired,
        checkout.session.async_payment_succeeded and checkout.session.async_payment_failed.
        Only complete/paid Sessions enter intake. Exact bound Session identity is
        required for pooled funding and any already-bound pledge. Old unbound legacy
        late payments bind only a cash-only receipt, without original incentives.
        Copied/recovered token metadata cannot consume pooled funding. Complete/unpaid
        retains funding. Expiry and verified async failure use common reconciliation.
        Existing legacy failure returns a legacy_async_failure receipt for #188's
        chargeback handler. Signed refund.* objects go through Payment-refund
        identity validation and the same acceptance/later-failure state machine used
        by admin retry; acceptance lowers item money once, shipping stays separate,
        and later failure requires explicit resolution. Auction completed/expired
        handling remains separate.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Event received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { enum: [true] }
        '400':
          description: Invalid signature

  # ─── Admin ───
  /admin/stats:
    get:
      tags: [Admin]
      summary: Admin dashboard stats
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: Aggregated stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  donors: { type: integer }
                  donations: { type: integer }
                  claims:
                    type: integer
                    description: Live reward entitlements only (PENDING, FULFILLED, CANCELLING with no reversal), counted once regardless of funding components.
                  pledged_cents:
                    type: integer
                    description: Current pledge amounts of pooled COMPLETED and REFUNDED donations, including Wallet funding; not money.
                  pledges:
                    type: object
                    required: [open, overdue]
                    properties:
                      open: { type: integer }
                      overdue:
                        {
                          type: integer,
                          description: OPEN past expires_at with Checkout Session not complete (including null or unknown state).,
                        }
                  payment_refunds:
                    type: object
                    required: [requested, failed]
                    properties:
                      requested: { type: integer }
                      failed:
                        {
                          type: integer,
                          description: FAILED records only; unresolved shipping on a RESOLVED record does not change its status.,
                        }
                  total_raised_cents:
                    type: integer
                    description: Money total. Counts current amount_cents of COMPLETED and REFUNDED donations, not CHARGEBACK or PENDING; hidden donations count. Shipping, Wallet funding and incentive allocations are excluded.
                  wallet_credit_cents:
                    type: object
                    description: Replaces unallocated_credits_cents. Available and held Wallet credit are separate, not additional charity money.
                    required: [available, held]
                    properties:
                      available: { type: integer }
                      held: { type: integer }
                  channels:
                    type: array
                    description: Donation-scoped money, pledge, Unused and Pool credit; incentive-scoped allocated cents. Never sum across categories or mix with money.
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        slug: { type: string }
                        event_id: { type: string }
                        raised_cents:
                          type: integer
                          description: Same money-total rule as total_raised_cents
                        donations:
                          type: integer
                          description: Count of all the Channel's donations, whatever their status
                        pledged_cents:
                          type: integer
                          description: Current pooled pledge amounts on counted donations routed to this Channel.
                        allocated_cents:
                          $ref: '#/components/schemas/PoolAmounts'
                        unused_pool_cents:
                          $ref: '#/components/schemas/UnusedPoolAmounts'
                        pool_credit_cents:
                          $ref: '#/components/schemas/PoolAmounts'
                  shared:
                    type: object
                    required: [allocated_cents]
                    description: Allocations of incentives without a Channel; never attributed to the source donation's Channel.
                    properties:
                      allocated_cents:
                        $ref: '#/components/schemas/PoolAmounts'

  /admin/channels:
    get:
      tags: [Admin]
      summary: List all channels
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: Channels ordered by created_at ascending, ordered default_goals ids, default_goal and fallback_goal (id/title or null) from the fulfillment resolver, has_eligible_default boolean. Ineligible entries stay listed; no donor data.
    post:
      tags: [Admin]
      summary: Create a channel
      description: |
        Creates a Channel on an Event. `slug` is optional; when omitted it is
        derived from `name` (and made unique across Events and Channels).
        `event_id` is optional while exactly one Event exists, otherwise required.
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug:
                  type: string
                  description: Optional. Lowercase URL- and routing-safe name; derived from `name` when omitted.
                event_id:
                  type: string
                  description: Optional. The Event this Channel belongs to; defaults to the only Event when one exists.
                is_active: { type: boolean, default: true }
      responses:
        '200':
          description: Channel created
        '400':
          description: Missing name, invalid slug, or unknown/ambiguous event_id
        '409':
          description: Channel name already exists, or the slug is already used by another event or channel

  /admin/channels/{id}:
    put:
      tags: [Admin]
      summary: Update a channel
      description: |
        A Channel's `slug` cannot change while it is active, and the primary
        Channel of an active Event cannot be deactivated or moved to another Event.
        default_goals replaces the ordered own/shared goal-id list; another
        Channel's goal is rejected with 400. Ineligible entries are preserved.
        Channel list/update responses include the ordered default_goals ids.
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug:
                  type: string
                  description: Only accepted while the Channel is inactive.
                event_id: { type: string }
                is_active: { type: boolean }
                default_goals: { $ref: '#/components/schemas/DefaultGoals' }
      responses:
        '200':
          description: Channel updated
        '400':
          description: Empty name, invalid slug, or unknown event_id
        '404':
          description: Channel not found
        '409':
          description: Slug change on an active channel, deactivating/moving the primary channel of an active event, duplicate name, or slug already in use
    delete:
      tags: [Admin]
      summary: Deactivate a channel
      description: Soft-delete — sets is_active false rather than removing the row, to preserve references from incentives/donations/pledges.
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Channel deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  channel: { type: object, description: The deactivated Channel row }

  /admin/events:
    get:
      tags: [Admin]
      summary: List all events
      description: Admin view — unlike the public `/events`, this includes inactive Events.
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: All Events ordered by created_at ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      tags: [Admin]
      summary: Create an event
      description: |
        Creates an Event. `slug` is optional; when omitted it is derived from
        `name` and made unique across Events and Channels. New Events start
        inactive — activating one requires a primary Channel of that same Event.
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug:
                  type: string
                  description: Optional. Lowercase URL- and AMQP-routing-safe name; derived from `name` when omitted.
                is_active:
                  type: boolean
                  default: false
                  description: Must be a boolean when present. Activating on create requires primary_channel_id.
                primary_channel_id:
                  type: string
                  nullable: true
                  description: Channel that receives donations naming no Channel; must be a Channel of this Event and active while the Event is active.
      responses:
        '200':
          description: The created Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400':
          description: Missing name, invalid slug, or non-boolean is_active
        '409':
          description: Name or slug already in use (by an Event or a Channel), or activation without a valid primary Channel

  /admin/events/{id}:
    put:
      tags: [Admin]
      summary: Update an event
      description: |
        Updates an Event's name, slug, is_active, or primary_channel_id. A slug
        can only change while the Event is inactive. Activating requires an
        active primary Channel belonging to this Event, and the primary Channel
        of an active Event cannot be cleared.
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug:
                  type: string
                  description: Only accepted while the Event is inactive.
                is_active: { type: boolean }
                primary_channel_id:
                  type: string
                  nullable: true
                  description: Set null only while the Event is inactive.
      responses:
        '200':
          description: The updated Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400':
          description: Empty name, invalid slug, non-boolean is_active, or a primary Channel belonging to another Event
        '404':
          description: Event not found
        '409':
          description: Slug change on an active event, activation without an active primary channel of this event, clearing the primary channel of an active event, or duplicate name/slug
    delete:
      tags: [Admin]
      summary: Deactivate an event
      description: Soft-delete — sets is_active false rather than removing the row, since Channels/incentives/donations/pledges may still reference it.
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The deactivated Event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  event: { $ref: '#/components/schemas/Event' }
        '404':
          description: Event not found

  /admin/donations:
    get:
      tags: [Admin]
      summary: List all donations
      security: [{ AdminKey: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Comma-separated status filter (#63), e.g. "REFUNDED,CHARGEBACK"
          schema: { type: string }
      responses:
        '200':
          description: All Donation scalar fields, admin-only donor email, Channel/Event identity, live source-local allocations, flags/needs_attention, unused_cents and category Pools. Array shape retained, ordered by created_at descending. Action eligibility is provided by the detail endpoint.

  /admin/donations/{id}:
    get:
      tags: [Admin]
      summary: Staff donation detail with live source-local Pools and action eligibility
      description: Reuses current accounting and all-source reversal guards. Only this admin router joins private donor email; shared helpers never do. Wallet-only cash0 and NULL-D legacy donations remain distinct.
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current donation, Pools, safe live allocations and disabled reasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDonationDetail' }
        '404': { description: Donation not found }

  /admin/donors/{id}/reverse-spend-preview:
    get:
      tags: [Admin]
      summary: Preview the recorded credit destinations of one live spend record
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: spend_type,
            in: query,
            required: true,
            schema: { type: string, enum: [claim, vote, contribution] },
          }
        - { name: spend_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Source-linked destinations, including original grants and ended-Event conversion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReversalPreview' }
        '400': { description: Missing spend_type or spend_id }
        '404': { description: Spend record not found or belongs to another donor }
        '409': { description: 'Reversed, fulfilled, CANCELLING, charged-back or REQUESTED source' }

  /admin/goals/{id}/reversal-preview:
    get:
      tags: [Admin]
      summary: Preview all live contribution destinations before reverse or reverse-and-deactivate
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One destination per financial component; categories are not charity money
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReversalPreview' }
        '409': { description: A source Payment refund is REQUESTED }

  /admin/polls/options/{id}/reversal-preview:
    get:
      tags: [Admin]
      summary: Preview all live vote destinations before reverse or reverse-and-deactivate
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One destination per financial component; no credit for old charged-back sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReversalPreview' }
        '409': { description: A source Payment refund is REQUESTED }

  /admin/donations/{id}/reversal-preview:
    get:
      tags: [Admin]
      summary: Preview a Wallet refund or chargeback
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: status,
            in: query,
            required: true,
            schema: { type: string, enum: [REFUNDED, CHARGEBACK] },
          }
      responses:
        '200':
          description: Computed effect; confirmation rechecks the same rules inside its transaction
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    donation_id,
                    status,
                    accounting,
                    wallet_adjustment_cents,
                    money_before_cents,
                    money_after_cents,
                    reversed_rows,
                    retained_claim_ids,
                    reversed_allocation_ids,
                    cleared_unused_cents,
                    cleared_pool_credit_cents,
                  ]
                properties:
                  donation_id: { type: string }
                  status: { type: string, enum: [REFUNDED, CHARGEBACK] }
                  accounting: { type: string, enum: [POOLED, LEGACY] }
                  wallet_adjustment_cents: { type: integer }
                  money_before_cents: { type: integer }
                  money_after_cents: { type: integer }
                  reversed_rows:
                    type: object
                    properties:
                      reward: { type: integer }
                      poll: { type: integer }
                      goal: { type: integer }
                  reversed_allocation_ids:
                    type: object
                    required: [reward, poll, goal]
                    properties:
                      reward: { type: array, items: { type: string } }
                      poll: { type: array, items: { type: string } }
                      goal: { type: array, items: { type: string } }
                  cleared_unused_cents:
                    type: object
                    properties:
                      poll: { type: integer }
                      goal: { type: integer }
                  retained_claim_ids: { type: array, items: { type: string } }
                  cleared_pool_credit_cents:
                    type: object
                    properties:
                      reward: { type: integer }
                      poll: { type: integer }
                      goal: { type: integer }
        '400': { description: 'Invalid status, terminal donation, or zero-money chargeback' }
        '404': { description: Donation not found }
        '409': { description: A Payment refund is REQUESTED }

  /admin/donations/{id}/status:
    patch:
      tags: [Admin]
      summary: Wallet refund or Record chargeback (manual PENDING/COMPLETED transitions are rejected)
      description: >-
        ADR-0011 pooled or NULL-D legacy accounting is selected per donation.
        Both actions reverse live linked rows except FULFILLED claims and clear Pool credit.
        REFUNDED grants the max-rule Wallet difference (legacy: live linked sum), records
        WALLET_REFUND and keeps money counted. CHARGEBACK returns original Wallet funding
        minus prior grants (legacy: live linked sum minus money), caps a negative adjustment
        at available Wallet credit, flags shipped claims, preserves completed goals and
        removes the remaining money from totals. Ordinary reversals recompute goal completion
        against its target. Both statuses are terminal; old terminal history is not repaired.
        Chargeback is blocked when money is zero. All changes and messages commit atomically.
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [REFUNDED, CHARGEBACK]
                reason: { type: string }
      responses:
        '200':
          description: Donation updated
        '400':
          description: Invalid status, unchanged status, terminal donation or zero-money chargeback
        '404':
          description: Donation not found
        '409':
          description: A Payment refund is REQUESTED

  /admin/donations/{id}/channel:
    patch:
      tags: [Admin]
      summary: Assign an unassigned donation to a channel
      description: >-
        Records the Channel and Event of a donation that arrived with neither
        (PRD-0002 §E6). Fails with 409 if the donation already has a Channel,
        so an assignment cannot be silently overwritten. Emits one
        `donation.created` webhook on success.
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id:
                  {
                    type: string,
                    description: The Channel to assign; its Event is set on the donation too.,
                  }
      responses:
        '200':
          description: The updated donation row (all Donation fields, with channel_id and event_id set)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id: { type: string }
                  channel_id: { type: string, nullable: true }
                  event_id: { type: string, nullable: true }
        '400':
          description: Missing channel_id, or the channel does not exist
        '404':
          description: Donation not found
        '409':
          description: The donation already has a Channel or an Event (a donation is never reassigned)

  /admin/claims/{id}/payment-refund-preview:
    get:
      tags: [Admin]
      summary: Physical Payment refund eligibility and current server-computed impact
      description: Confirmed type and direct funding determine eligibility, not a changed catalog type. Source must be COMPLETED, pooled, Stripe-backed and in a non-ended Event. Shipping is separate. Ended polls and completed goals are included and stay ended/complete.
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Eligibility with reason; eligible claims also include recorded item capped at remaining cash, last-physical-claim shipping, money/pledge before and after, and Pool financial reductions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRefundPreview' }
        '404': { description: Claim not found }
  /admin/claims/{id}/payment-refund:
    post:
      tags: [Admin]
      summary: Request one physical Payment refund
      description: Commits REQUESTED and claim CANCELLING before external Stripe I/O. Accepted pending/requires_action/succeeded cancels the claim and lowers money once, before final settlement. Definite creation rejection is RESOLVED/REJECTED with no accounting; unknown outcomes remain REQUESTED. Never use a new request to retry an uncertain refund.
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaymentRefundResult' }
        '404': { description: Claim not found }
        '409': { description: Ineligible claim or another REQUESTED refund on the source donation }
  /admin/payment-refunds:
    get:
      tags: [Admin]
      summary: List audited Payment refunds across donations
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: donation_id, in: query, schema: { type: string } }
        - name: status
          in: query
          description: Comma-separated statuses; defaults to REQUESTED,PENDING,REQUIRES_ACTION,FAILED plus item-resolved records whose failed shipping remains unresolved
          schema: { type: string }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Stable newest-first page with total, offset and limit. No donor email or private claim data.
          content:
            application/json:
              schema:
                type: object
                required: [records, total, offset, limit]
                properties:
                  records:
                    { type: array, items: { $ref: '#/components/schemas/PaymentRefundRecord' } }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        '400': { description: Invalid status or pagination; no silent caps }
  /admin/payment-refunds/{id}:
    get:
      tags: [Admin]
      summary: Read one Payment refund and its accounting audit
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaymentRefundResult' }
        '404': { description: Payment refund not found }
  /admin/payment-refunds/{id}/retry:
    post:
      tags: [Admin]
      summary: Reconcile an uncertain Payment refund or refresh pending settlement
      description: Exhaustively paginates PaymentIntent refunds and matches metadata locally before any create, even after 24-hour idempotency retention. Reuses the record id key only when no match exists. Accepted refunds are never created again. FAILED/RESOLVED/SUCCEEDED records are returned unchanged; there is no automatic repair.
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaymentRefundResult' }
        '404': { description: Payment refund not found }
        '409':
          {
            description: Missing/ambiguous Stripe refund or identity/amount mismatch; operator review required,
          }
  /admin/payment-refunds/{id}/resolve-item:
    post:
      tags: [Admin]
      summary: Resolve a later-failed accepted Payment refund item
      description: RETURNED_OUTSIDE_APP changes no accounting. WALLET_CREDIT requires COMPLETED/REFUNDED, restores item cash/D/total_donated and grants one linked FAILED_PAYMENT_REFUND adjustment; allocations stay shrunk and the per-category gap stays reserved. CHARGEBACK permits only outside return or SETTLED_BY_DISPUTE. Exact retries are idempotent; conflicting choices return 409. Shipping is never Wallet credit.
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  { type: string, enum: [RETURNED_OUTSIDE_APP, WALLET_CREDIT, SETTLED_BY_DISPUTE] }
      responses:
        '200': { $ref: '#/components/responses/PaymentRefundResult' }
        '400': { description: Invalid resolution }
        '404': { description: Payment refund not found }
        '409':
          {
            description: 'Not later-failed, already resolved differently, source status disallows resolution or another REQUESTED refund exists',
          }
  /admin/payment-refunds/{id}/resolve-shipping:
    post:
      tags: [Admin]
      summary: Resolve failed shipping independently of the item
      description: Audits RETURNED_OUTSIDE_APP or KEPT_BY_AGREEMENT with actor/time; no money, Wallet or Pool change. Works before or after item resolution. Exact retries are idempotent.
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, enum: [RETURNED_OUTSIDE_APP, KEPT_BY_AGREEMENT] }
      responses:
        '200': { $ref: '#/components/responses/PaymentRefundResult' }
        '400': { description: Invalid resolution }
        '404': { description: Payment refund not found }
        '409': { description: No failed shipping to resolve or already resolved differently }

  /admin/claims:
    get:
      tags: [Admin]
      summary: List all reward claims
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: Every claim (including reversed history), parsed claim_data, recorded amount_cents, reward current price, canonical funding_donation_ids and toggle_disabled_reason. All-source CHARGEBACK/REQUESTED guards apply. Private donor email is joined only in this admin router.

  /admin/claims/{id}:
    patch:
      tags: [Admin]
      summary: Update claim status
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, FULFILLED]
      responses:
        '200':
          description: Claim updated (with reward and admin-only donor email)
        '400': { description: Invalid status }
        '404': { description: Claim not found }
        '409': { description: 'Charged-back donation, REQUESTED Payment refund or non-live claim' }

  /admin/claims/{id}/acknowledge-chargeback:
    post:
      tags: [Admin]
      summary: Acknowledge a shipped claim flagged after a chargeback
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          {
            description: 'Claim with flag cleared and acknowledgement actor, time and optional note recorded; no credit or stock change',
          }
        '400': { description: Invalid note }
        '404': { description: Claim not found }
        '409': { description: No shipped chargeback flag to acknowledge }

  /admin/rewards:
    get:
      tags: [Admin]
      summary: List all rewards
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: All rewards ordered by created_at descending. Rows have the Reward/Poll/FundGoal fields, including `event_id` and `channel_id`, plus allocation summaries.
    post:
      tags: [Admin]
      summary: Create a reward
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type, cost_cents]
              properties:
                title: { type: string }
                description: { type: string }
                type:
                  type: string
                  enum: [DIGITAL, PHYSICAL, SHOUTOUT, CUSTOM]
                cost_cents: { type: integer }
                quantity_total: { type: integer, nullable: true }
                is_active: { type: boolean, default: true }
                custom_type_label: { type: string }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
                  description: |
                    Owning Event (ADR-0012). With channel_id it must be that Channel's Event.
                    Without channel_id (a shared incentive) it defaults to the only Event;
                    when two or more Events exist it is required.
      responses:
        '200':
          description: Reward created

  /admin/rewards/{id}:
    put:
      tags: [Admin]
      summary: Update a reward
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                type: { type: string, enum: [DIGITAL, PHYSICAL, SHOUTOUT, CUSTOM] }
                cost_cents: { type: integer }
                quantity_total: { type: integer, nullable: true }
                is_active: { type: boolean }
                custom_type_label: { type: string }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
                  description: Must be the current Event; an incentive never moves to another Event (ADR-0012).
      responses:
        '200':
          description: Reward updated
    delete:
      tags: [Admin]
      summary: Delete a reward
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted (no allocation history)
        '409':
          $ref: '#/components/responses/AllocationHistoryConflict'

  /admin/simulate-donation:
    post:
      tags: [Admin]
      summary: Add a donation (manual entry / no real payment) — dev simulation or a real donation received externally (#62)
      description: |
        Records received money through the common intake and sends a magic link.
        An exact pooled pledge_token fulfills its confirmed plan using new money
        and grants no Wallet credit. Without a pooled pledge, NULL-D legacy cash
        receipts credit the donor's Wallet. This admin adapter is for dev/test
        simulation or recording donations received outside Stripe; it does not
        prove Stripe Checkout, Session binding, signatures or address collection.
        Pass external_id with the external platform's reference for deduplication
        and traceability, and occurred_at to backdate the receipt.
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, amount_cents]
              properties:
                email: { type: string, format: email }
                donor_name: { type: string }
                amount_cents: { type: integer, minimum: 100 }
                comment: { type: string }
                pledge_token: { type: string }
                channel_id:
                  type: string
                  nullable: true
                  description: Optional channel to attribute this donation to (bypasses the pledge flow's required-channel check).
                event_id:
                  type: string
                  nullable: true
                  description: Optional event to attribute this donation to; routes to that event's primary channel when channel_id is omitted.
                external_id:
                  type: string
                  description: Optional caller-supplied reference (e.g. an external platform's own transaction id) for dedup/traceability. Falls back to an auto-generated sim-<uuid> when omitted. Must be unique — reusing one returns 409.
                occurred_at:
                  type: string
                  format: date-time
                  description: Optional; backdates the created Donation's created_at to when the donation actually occurred (e.g. on the external platform). Defaults to now.
      responses:
        '200':
          description: Donation added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { enum: [true] }
                  token: { type: string, description: 'Donor magic token' }
                  donor:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      balance_remaining: { type: integer }
                  donation:
                    type: object
                    description: The created Donation, with the Channel and Event the routing rules resolved to (both null when unassigned).
                    properties:
                      id: { type: string }
                      channel_id: { type: string, nullable: true }
                      event_id: { type: string, nullable: true }
                  pledge: { type: object, nullable: true }
        '400':
          description: Missing/invalid email, amount_cents, external_id, occurred_at, or an unknown channel_id/event_id
        '409':
          description: A donation with the given external_id already exists

  /admin/donors:
    get:
      tags: [Admin]
      summary: List donors
      security: [{ AdminKey: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Search by email
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: Pagination offset
      responses:
        '200':
          description: Paginated donor list (capped at 50)

    post:
      tags: [Admin]
      summary: Create a donor account without a prior donation
      description: >-
        Lets an admin provision a donor record ahead of time (e.g. to grant
        MODERATOR/ADMIN role before the person has donated). The donor can
        later log in via a regenerated magic-link token or via SSO with a
        matching email.
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { type: string, enum: [USER, MODERATOR, ADMIN] }
      responses:
        '200':
          description: Donor created
        '400':
          description: Missing email or invalid role
        '409':
          description: Donor with this email already exists

  /admin/donors/{id}:
    get:
      tags: [Admin]
