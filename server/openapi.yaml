                is_active: { type: boolean, default: true }
                custom_type_label: { type: string }
                image_url: { type: string, nullable: true }
                channel_id: { type: string, nullable: true }
      responses:
        '200':
          description: Reward created

  /moderator/rewards/{id}:
    put:
      tags: [Moderator]
      summary: Update a reward
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                type: { type: string, enum: [DIGITAL, PHYSICAL, SHOUTOUT, CUSTOM] }
                cost_cents: { type: integer }
                quantity_total: { type: integer, nullable: true }
                is_active: { type: boolean }
                custom_type_label: { type: string }
                image_url: { type: string, nullable: true }
                channel_id: { type: string, nullable: true }
      responses:
        '200':
          description: Reward updated
    delete:
      tags: [Moderator]
      summary: Delete a reward
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted

  /moderator/claims:
    get:
      tags: [Moderator]
      summary: List all reward claims
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Claims with reward details (no donor email)

  /moderator/claims/{id}:
    patch:
      tags: [Moderator]
      summary: Update claim status
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, FULFILLED]
      responses:
        '200':
          description: Claim updated

  /moderator/donations:
    get:
      tags: [Moderator]
      summary: List all donations (regardless of donor), for moderation review
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Donations with donor name (no donor email), channel (id, name), and moderation status

  /moderator/donations/{id}:
    patch:
      tags: [Moderator]
      summary: Mark (or unmark) a donation as moderated
      description: |
        Sets `moderated`, `moderated_at`, and `moderated_by` so downstream
        tools (exports, leaderboards, Discord role sync, etc.) can rely on
        which donations a human has reviewed.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moderated]
              properties:
                moderated: { type: boolean }
      responses:
        '200':
          description: Donation updated
        '400':
          description: moderated must be a boolean

  /moderator/goals:
    get:
      tags: [Moderator]
      summary: List all fund goals
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Goals ordered by created_at descending
    post:
      tags: [Moderator]
      summary: Create a fund goal
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, target_cents]
              properties:
                title: { type: string }
                description: { type: string }
                target_cents: { type: integer }
                channel_id: { type: string, nullable: true }
                is_active: { type: boolean, default: true }
      responses:
        '200':
          description: Goal created

  /moderator/goals/{id}:
    put:
      tags: [Moderator]
      summary: Update a fund goal
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                target_cents: { type: integer }
                channel_id: { type: string, nullable: true }
                is_active: { type: boolean }
                is_complete: { type: boolean }
      responses:
        '200':
          description: Goal updated
    delete:
      tags: [Moderator]
      summary: Delete a fund goal
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted

components:
  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Admin API key matching `ADMIN_API_KEY` env var
  schemas:
    EventDestination:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        secret:
          {
            type: string,
            description: 'Included on creation only; use rotate-secret to obtain a new value',
          }
        is_active: { type: boolean }
        event_types:
          type: array
          items:
            type: string
            enum:
              [
                donation.created,
                donation.moderated,
                incentive.created,
                incentive.enabled,
                incentive.disabled,
                incentive.value_changed,
              ]
        verify_ssl: { type: boolean }
        description: { type: string, nullable: true }
        destination_type:
          type: string
          enum: [HTTP, RABBITMQ]
          default: HTTP
        amqp_url:
          {
            type: string,
            nullable: true,
            description: 'Required for RabbitMQ endpoints. amqp:// or amqps://',
          }
        amqp_exchange: { type: string, default: '' }
        amqp_routing_key:
          { type: string, nullable: true, description: 'Required for RabbitMQ endpoints' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventDelivery:
      type: object
      properties:
        id: { type: string }
        seq: { type: integer }
        endpoint_id: { type: string }
        event_type: { type: string }
        payload: { type: string }
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        attempts: { type: integer }
        max_attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        last_status_code: { type: integer, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
