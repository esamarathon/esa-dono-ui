  /admin/pledges:
    get:
      tags: [Admin]
      summary: List Pending pledges (array-compatible, paginated)
      security: [{ AdminKey: [] }]
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string },
            description: Comma-separated stored statuses OPEN/FULFILLED/EXPIRED/CANCELLED/PAYMENT_REVIEW. Omitted retains all-status compatibility; the staff UI defaults OPEN. Late LEGACY cash remains EXPIRED; filter its canonical payment_state instead.,
          }
        - name: payment_state
          in: query
          description: Canonical checkout outcome, filtered before pagination/counting. LEGACY_PAID selects linked late LEGACY cash receipts whose stored status stays EXPIRED; original historical FULFILLED remains FULFILLED.
          schema:
            type: string
            enum:
              [
                READY,
                OPEN,
                PROCESSING,
                UNKNOWN,
                NON_PAYMENT,
                FULFILLED,
                LEGACY_PAID,
                PAYMENT_REVIEW,
              ]
        - {
            name: overdue,
            in: query,
            schema: { type: boolean },
            description: OPEN with deadline before now and Session not complete; never proof of non-payment.,
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 100 },
          }
      responses:
        '200':
          description: Raw admin-only pledge fields plus canonical payment_state, overdue, separate shipping_cents (null until recorded), item label/current_price_cents and confirmed unit_price_cents. payment_state LEGACY_PAID identifies late cash linked to a LEGACY pledge that stays EXPIRED. PAYMENT_REVIEW is distinct; neither means original fulfillment. Historical FULFILLED stays fulfilled. Drafts remain browser-only.
          headers:
            X-Total-Count:
              { description: Total records matching filters, schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffPledgeRead' }
        '400': { description: Invalid filter or pagination }

  /admin/pledges/{id}/check-stripe:
    post:
      tags: [Admin]
      summary: Check Stripe for a Pending pledge
      description: Runs the same reconciliation as the public return. No manual release or automatic sweep.
      security: [{ AdminKey: [] }, { DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PledgeState' }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
        '404': { description: Pledge not found }
        '409': { description: Stripe state unknown; funding and immutable review retained }

