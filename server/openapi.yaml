      tags: [Moderator]
      summary: Delete a reward
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted (no allocation history)
        '409':
          $ref: '#/components/responses/AllocationHistoryConflict'

  /moderator/claims:
    get:
      tags: [Moderator]
      summary: List all reward claims
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      responses:
        '200':
          description: Live-only claims (unreversed PENDING/FULFILLED/CANCELLING), recorded amount_cents, reward current price, parsed claim_data and funding_donation_ids. donor_name comes from the own donation, including a null name; ONLY an unlinked claim falls back to the donor's newest donation. No donor object or donor email.

  /moderator/donations:
    get:
      tags: [Moderator]
      summary: List all donations (regardless of donor), for moderation review
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      responses:
        '200':
          description: Safe current donation state with source-local live allocation labels, assignment actor/time, flags, needs_attention and unused_cents per poll/goal. No donor join/email or Pools/Pool-credit projection. Legacy pledge_items/top_up_cents remain for API compatibility only, not the staff display.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffDonationRead' }

  /moderator/donations/{id}:
    patch:
      tags: [Moderator]
      summary: Moderate a donation and/or hide it from the stream overlay
      description: |
        Accepts `moderated` and/or `hidden_from_overlay`; at least one is
        required (400 otherwise).

        `moderated` sets `moderated`, `moderated_at`, and `moderated_by` so
        downstream tools (exports, leaderboards, Discord role sync, etc.) can
        rely on which donations a human has reviewed. It is a review flag only
        and does not republish to Tiltify destinations.

        `hidden_from_overlay` hides the donation from the stream overlay. It
        publishes native `donation.hidden`/`donation.unhidden` messages and
        republishes the Tiltify donation (as "Anonymous" without `completed_at`
        when hidden).
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of moderated / hidden_from_overlay is required.
              properties:
                moderated: { type: boolean }
                hidden_from_overlay: { type: boolean }
      responses:
        '200':
          description: Donation updated
        '400':
          description: Neither moderated nor hidden_from_overlay provided, or a value is not a boolean
        '404':
          description: Donation not found

  /moderator/goals:
    get:
      tags: [Moderator]
      summary: List all fund goals
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      responses:
        '200':
          description: Goals ordered by created_at descending. Rows have the Reward/Poll/FundGoal fields, including `event_id` and `channel_id`, plus allocation summaries.
    post:
      tags: [Moderator]
      summary: Create a fund goal
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, target_cents]
              properties:
                title: { type: string }
                description: { type: string }
                target_cents: { type: integer }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
                  description: |
                    Owning Event (ADR-0012). With channel_id it must be that Channel's Event.
                    Without channel_id (a shared incentive) it defaults to the only Event;
                    when two or more Events exist it is required.
                is_active: { type: boolean, default: true }
      responses:
        '200':
          description: Goal created

  /moderator/goals/{id}:
    put:
      tags: [Moderator]
      summary: Update a fund goal
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                target_cents: { type: integer }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
                  description: Must be the current Event; an incentive never moves to another Event (ADR-0012).
                is_active: { type: boolean }
      responses:
        '200':
          description: Goal updated; completion derives from current allocation versus target on target edits
        '400': { description: Invalid input or supplied manual is_complete }
        '409':
          { description: Channel change with allocation history or a Default goal list reference }
    delete:
      tags: [Moderator]
      summary: Delete a fund goal
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted (no allocation history)
        '409':
          $ref: '#/components/responses/AllocationHistoryConflict'

  /moderator/auctions:
    get:
      tags: [Moderator]
      summary: List all auctions
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      responses:
        '200':
          description: All auctions ordered by created_at descending
    post:
      tags: [Moderator]
      summary: Create an auction
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type, starting_price_cents, min_increment_cents, ends_at]
              properties:
                title: { type: string }
                description: { type: string }
                type:
                  type: string
                  enum: [DIGITAL, PHYSICAL, SHOUTOUT, CUSTOM]
                custom_type_label: { type: string }
                image_url: { type: string, nullable: true }
                starting_price_cents: { type: integer }
                min_increment_cents: { type: integer }
                ends_at: { type: string, format: date-time }
                is_active: { type: boolean, default: true }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
                  description: |
                    Owning Event (ADR-0012). With channel_id it must be that Channel's Event.
                    Without channel_id (a shared incentive) it defaults to the only Event;
                    when two or more Events exist it is required.
      responses:
        '200':
          description: Auction created

  /moderator/auctions/{id}:
    put:
      tags: [Moderator]
      summary: Update an auction
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                type: { type: string, enum: [DIGITAL, PHYSICAL, SHOUTOUT, CUSTOM] }
                custom_type_label: { type: string }
                image_url: { type: string, nullable: true }
                starting_price_cents: { type: integer }
                min_increment_cents: { type: integer }
                ends_at: { type: string, format: date-time }
                is_active: { type: boolean }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
                  description: Must be the current Event; an incentive never moves to another Event (ADR-0012).
      responses:
        '200':
          description: Auction updated

  /moderator/auctions/{id}/offers:
    get:
      tags: [Moderator]
      summary: List the cascade offer history for an auction
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Offers ordered by rank ascending (never includes donor email)

  /moderator/auctions/{id}/bids:
    get:
      tags: [Moderator]
      summary: List all bids for an auction
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Bids ordered by created_at descending (never includes donor email)

  /moderator/auctions/{id}/reopen:
    post:
      tags: [Moderator]
      summary: Reopen a cancelled auction for bidding
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Auction reopened (status OPEN)

  /moderator/auctions/{id}/close:
    post:
      tags: [Moderator]
      summary: Force-close an auction ahead of its ends_at
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Auction closed; rank-1 offer sent, or UNSOLD if no bids

  /moderator/auctions/{id}/cancel:
    post:
      tags: [Moderator]
      summary: Cancel an auction before settlement
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Auction cancelled

  /moderator/auctions/{id}/skip-offer:
    post:
      tags: [Moderator]
      summary: Expire the current cascade offer early and advance to the next bidder
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Advanced to the next offer, or UNSOLD if the list is exhausted

  /moderator/auctions/{id}/resend-offer:
    post:
      tags: [Moderator]
      summary: Resend the current offer's payment email without advancing the cascade
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Offer email resent

  /moderator/unused-pool-money:
    get:
      tags: [Moderator]
      summary: List computed Unused pool money and live moderator assignments
      description: COMPLETED pooled donations only; no donor email. Unassigned donations require admin routing before assignment. No stored unused balances or end-conversion transfers.
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - { name: comments_only, in: query, schema: { type: boolean, default: true } }
        - { name: show_ended, in: query, schema: { type: boolean, default: false } }
        - { name: channel_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Safe donation list, including zero-unused donations with live assignments for undo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UnusedDonation' } }
  /moderator/donations/{id}/unused-pool-money/targets:
    get:
      tags: [Moderator]
      summary: Eligible own-Channel or shared targets with server-computed impact
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: category,
            in: query,
            required: true,
            schema: { type: string, enum: [poll, goal] },
          }
      responses:
        '200':
          description: All category unused cents and eligible targets; positive cents, overshoot and no age limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnusedPicker' }
        '400': { description: Invalid category }
        '404': { description: Donation not found }
        '409': { description: 'Legacy, terminal, unassigned or REQUESTED Payment refund source' }
  /moderator/donations/{id}/unused-pool-money:
    post:
      tags: [Moderator]
      summary: Atomically assign all of one unused category and publish the donation
      description: Requires an ACTIVE option of an open poll or an active incomplete goal. Event end does not prohibit assignment. Records source moderator and allocated_at; allocated_by is the session email or moderator fallback. No Wallet or Pool credit grant.
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, target_id, expected_amount_cents]
              properties:
                category: { type: string, enum: [poll, goal] }
                target_id: { type: string }
                expected_amount_cents: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Created allocation row (never donor email)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  donation_id: { type: string }
                  amount_cents: { type: integer }
                  source: { type: string, enum: [moderator] }
                  allocated_by: { type: string }
                  allocated_at: { type: string, format: date-time }
        '400': { description: 'Invalid category, target id or expected positive integer cents' }
        '404': { description: Donation not found }
        '409':
          {
            description: 'Stale unused amount, ineligible target, unassigned or non-live source, or REQUESTED Payment refund',
          }
  /moderator/unused-pool-money/{category}/{id}/undo:
    post:
      tags: [Moderator]
      summary: Reverse a moderator assignment while its target is open
      description: Returns funding to computed Unused pool money, never Wallet or Pool credit. Publishes changed donation state atomically through the common reversal boundary.
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - { name: category, in: path, required: true, schema: { type: string, enum: [poll, goal] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Assignment reversed }
        '400': { description: Invalid category or already reversed }
        '404': { description: Moderator assignment not found }
        '409': { description: 'Target closed, chargeback or REQUESTED Payment refund' }
  /admin/events/{id}/end-preview:
    get:
      tags: [Admin]
      summary: Preview explicit Event end, not deactivation
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { AdminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Conversion, reward expiry, closing physical-refund window and open pledges, with blockers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventEndPreview' }
        '404': { description: Event not found }
  /admin/events/{id}/undo-end-preview:
    get:
      tags: [Admin]
      summary: Preview restored Pool credit and any consuming post-end assignments
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { AdminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Restore preview; live post-end assignments block only when restoring raw credit would exceed their donation category budget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventEndPreview' }
        '404': { description: Event not found }
  /admin/events/{id}/end:
    post:
      tags: [Admin]
      summary: Explicitly end an inactive Event with slug confirmation
      description: No REQUESTED Payment refund may exist. Sets ended_at/by and appends EventEndAudit; credit conversion/expiry is derived, never transferred. Ended Events cannot reactivate.
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { AdminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [slug], properties: { slug: { type: string } } }
      responses:
        '200':
          description: Ended Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { description: Slug confirmation does not match }
        '404': { description: Event not found }
        '409': { description: 'Event active, already ended or REQUESTED Payment refund' }
  /admin/events/{id}/undo-end:
    post:
      tags: [Admin]
      summary: Undo Event end without a time limit
      description: Clears ended_at/by, leaves the Event inactive, restores derived credit and the Payment refund window, records end_undone_at/by and appends EventEndAudit. Reverse live post-end assignments consuming converted credit first; assignments funded entirely by original Unused do not block.
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { AdminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [slug], properties: { slug: { type: string } } }
      responses:
        '200':
          description: Inactive Event with restored credit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { description: Slug confirmation does not match }
        '404': { description: Event not found }
        '409':
          {
            description: Event not ended or converted credit consumed by live post-end moderator assignments,
          }

components:
  responses:
    PaymentRefundResult:
      description: Audited Payment refund record. Acceptance is not final settlement; no donor email or private claim data.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaymentRefundRecord' }
    PledgeState:
      description: Immutable review and derived payment state. No donor email, auth token or shipping address.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PledgeRead' }
    PledgeReconciliationConflict:
      description: Reconciliation unconfirmed, or a read-only legacy pledge. Keep the review; do not start another checkout.
      content:
        application/json:
          schema:
            type: object
            required: [error, pledge]
            properties:
              error: { type: string }
              pledge: { $ref: '#/components/schemas/PledgeRead' }
    AllocationHistoryConflict:
      description: The incentive has allocation history, including reversed rows. Nothing is removed.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: ['This has allocation history. Deactivate it instead.']
  securitySchemes:
    AdminKey:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer key_admin_<ADMIN_API_KEY>`, or a donor session/token whose role is ADMIN.'
    ModeratorKey:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer key_mod_<MODERATOR_API_KEY>`. Moderator routes also accept a donor session/token whose role is MODERATOR or ADMIN.'
    DonorSession:
      type: apiKey
      in: cookie
      name: dono_session
      description: httpOnly session cookie holding the donor magic token (set by /auth/magic, /auth/session or OAuth).
    DonorBearer:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <magic_token>` (or `donor_<magic_token>`), for non-browser clients.'
  schemas:
    SpendReversalPreview:
      type: object
      required: [destinations]
      properties:
        destinations:
          type: array
          items:
            type: object
            required: [destination, category, donation_id, credit_id, amount_cents]
            properties:
              destination:
                {
                  type: string,
                  enum: [Wallet credit, Pool credit, Unused pool money, Expired reward Pool credit],
                }
              category: { type: string, enum: [reward, poll, goal] }
              donation_id: { type: string, nullable: true }
              credit_id:
                {
                  type: string,
                  nullable: true,
                  description: Original grant restored by a redemption reversal,
                }
              amount_cents:
                { type: integer, description: 'Recorded effective component, not catalog price' }
    StaffAllocation:
      type: object
      required: [id, label, channel, source, amount_cents]
      properties:
        id: { type: string }
        label: { type: string }
        channel: { type: string, description: Incentive Channel name or shared }
        source: { type: string, enum: [donor, auto, moderator] }
        amount_cents: { type: integer, description: Source-local effective allocation }
        status: { type: string }
        allocated_by:
          {
            type: string,
            nullable: true,
            description: 'Staff assignment attribution, never source donor identity',
          }
        allocated_at: { type: string, format: date-time, nullable: true }
        recorded_amount_cents:
          { type: integer, description: Whole reward entitlement recorded amount }
        current_price_cents:
          { type: integer, description: 'Current reward catalog price, not the allocation' }
        chargeback_flagged_at: { type: string, format: date-time, nullable: true }
    CategoryAccounting:
      type: object
      required: [live_cents, outstanding_credit_cents, pool_credit_cents, unused_cents, used_cents]
      properties:
        live_cents: { type: integer }
        outstanding_credit_cents: { type: integer }
        pool_credit_cents: { type: integer }
        unused_cents: { type: integer }
        used_cents: { type: integer }
    StaffDonationRead:
      type: object
      description: Donation scalar fields, routing/Event metadata and safe live allocation labels. No donor join. Moderator responses omit Pools/Pool-credit panels and retain legacy pledge_items/top_up_cents only for additive compatibility.
      required:
        [
          id,
          donor_id,
          amount_cents,
          pledge_amount_cents,
          wallet_applied_cents,
          status,
          allocations,
          flags,
          needs_attention,
          unused_cents,
        ]
      properties:
        id: { type: string }
        donor_id: { type: string }
        amount_cents: { type: integer }
        pledge_amount_cents: { type: integer, nullable: true }
        wallet_applied_cents: { type: integer }
        status: { type: string, enum: [PENDING, COMPLETED, REFUNDED, CHARGEBACK] }
        allocations:
          type: object
          required: [reward, poll, goal]
          properties:
            reward: { type: array, items: { $ref: '#/components/schemas/StaffAllocation' } }
            poll: { type: array, items: { $ref: '#/components/schemas/StaffAllocation' } }
            goal: { type: array, items: { $ref: '#/components/schemas/StaffAllocation' } }
        flags: { type: array, items: { type: string } }
        needs_attention: { type: boolean }
        ended_target_changes:
          type: array
          description: All recorded Payment-refund affected targets that were ended/completed, without a history-page cap
          items:
            type: object
            properties:
              payment_refund_id: { type: string }
              category: { type: string, enum: [poll, goal] }
              target_id: { type: string }
              poll_id: { type: string, nullable: true }
              label: { type: string }
              before_cents: { type: integer }
              after_cents: { type: integer }
              ended: { type: boolean }
              completed: { type: boolean }
        unused_cents:
          type: object
          properties:
            poll: { type: integer }
            goal: { type: integer }
    AdminDonationDetail:
      allOf:
        - { $ref: '#/components/schemas/StaffDonationRead' }
        - type: object
          required: [pools, action_disabled_reasons, donor]
          properties:
            donor:
              type: object
              nullable: true
              properties:
                email: { type: string, description: Joined only in routes/admin.ts }
            pools:
              type: object
              required: [reward, poll, goal]
              properties:
                reward: { $ref: '#/components/schemas/CategoryAccounting' }
                poll: { $ref: '#/components/schemas/CategoryAccounting' }
                goal: { $ref: '#/components/schemas/CategoryAccounting' }
            action_disabled_reasons:
              type: object
              required: [REFUNDED, CHARGEBACK]
              properties:
                REFUNDED: { type: string, nullable: true }
                CHARGEBACK: { type: string, nullable: true }
    StaffPledgeRead:
      type: object
      description: Existing raw admin-only PendingPledge scalar fields are retained (including donor_email). No shared service adds private identity. Canonical payment state is projected by pledgePaymentState, not reimplemented by the staff page.
      required:
        [id, status, format, payment_state, overdue, shipping_cents, items, admin_review_required]
      properties:
        id: { type: string }
        status: { type: string }
        format: { type: string, enum: [POOLED, LEGACY] }
        pledge_amount_cents: { type: integer, nullable: true }
        new_money_cents: { type: integer, nullable: true }
        held_wallet_cents:
          {
            type: integer,
            description: 'Original confirmed Wallet funding, retained after release or consumption',
          }
        wallet_held_cents:
          {
            type: integer,
            description: 'Currently held amount only, zero unless wallet_hold_status is HELD',
          }
        wallet_hold_status: { type: string, enum: [NONE, HELD, CONSUMED, RELEASED] }
        checkout_session_status: { type: string, nullable: true }
        payment_status: { type: string, nullable: true }
        payment_state:
          {
            type: string,
            enum:
              [
                READY,
                OPEN,
                PROCESSING,
                UNKNOWN,
                NON_PAYMENT,
                FULFILLED,
                LEGACY_PAID,
                PAYMENT_REVIEW,
              ],
          }
        overdue: { type: boolean }
        shipping_cents: { type: integer, nullable: true }
        admin_review_required: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              unit_price_cents: { type: integer, nullable: true }
              current_price_cents: { type: integer, nullable: true }
              amount_cents: { type: integer }
    PaymentRefundRecord:
      type: object
      required:
        [
          id,
          donation_id,
          claim_id,
          item_cents,
          shipping_cents,
          status,
          stripe_refund_id,
          pool_shrink_data,
          failure_reason,
          resolution,
          shipping_resolution,
          created_by,
          created_at,
          updated_at,
          accepted_at,
          resolved_at,
          resolved_by,
          shipping_resolved_at,
          shipping_resolved_by,
        ]
      properties:
        id: { type: string, description: Stripe idempotency key }
        donation_id: { type: string }
        claim_id: { type: string }
        item_cents: { type: integer }
        shipping_cents: { type: integer }
        status:
          { type: string, enum: [REQUESTED, PENDING, REQUIRES_ACTION, SUCCEEDED, FAILED, RESOLVED] }
        stripe_refund_id: { type: string, nullable: true }
        pool_shrink_data:
          type: string
          nullable: true
          description: JSON-encoded PaymentRefundShrink snapshot, committed once on acceptance. Includes original/effective financial components and their reduction before/after, including ended targets. Never infer original consumption from reduced allocation rows.
        failure_reason: { type: string, nullable: true }
        resolution:
          {
            type: string,
            nullable: true,
            enum: [REJECTED, RETURNED_OUTSIDE_APP, WALLET_CREDIT, SETTLED_BY_DISPUTE, null],
          }
        shipping_resolution:
          { type: string, nullable: true, enum: [RETURNED_OUTSIDE_APP, KEPT_BY_AGREEMENT, null] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true }
        shipping_resolved_at: { type: string, format: date-time, nullable: true }
        shipping_resolved_by: { type: string, nullable: true }
    PaymentRefundPreview:
      type: object
      required: [eligible, reason, claim_id, donation_id]
      properties:
        eligible: { type: boolean }
        reason: { type: string, nullable: true }
        claim_id: { type: string }
        donation_id: { type: string, nullable: true }
        item_cents: { type: integer }
        shipping_cents: { type: integer }
        money_before_cents: { type: integer }
        money_after_cents: { type: integer }
        pledge_before_cents: { type: integer }
        pledge_after_cents: { type: integer }
        wallet_applied_cents: { type: integer }
        pool_shrink: { $ref: '#/components/schemas/PaymentRefundShrink' }
    PaymentRefundShrink:
      type: object
      properties:
        donation_id: { type: string }
        claim_id: { type: string }
        money_before_cents: { type: integer }
        money_after_cents: { type: integer }
        pledge_before_cents: { type: integer }
        pledge_after_cents: { type: integer }
        wallet_applied_cents: { type: integer }
        failed_payment_wallet_credit_cents: { type: integer }
        affected_targets:
          type: array
          description: Aggregated target progress before/after including safe labels, ended polls and completed goals. Pending-option funding does not lower its public tally.
          items:
            type: object
            properties:
              category: { type: string, enum: [poll, goal] }
              target_id: { type: string }
              poll_id: { type: string, nullable: true }
              label: { type: string }
              before_cents: { type: integer }
              after_cents: { type: integer }
              ended: { type: boolean }
              completed: { type: boolean }
        categories:
          type: object
          additionalProperties:
            type: object
            properties:
              before_cents: { type: integer }
              after_cents: { type: integer }
              unused_consumed_cents: { type: integer }
              reduced_cents: { type: integer }
        components:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [claim, vote, contribution, redemption, credit] }
              id: { type: string }
              category: { type: string, enum: [reward, poll, goal] }
              before_cents: { type: integer }
              after_cents: { type: integer }
              target_id: { type: string, nullable: true }
              allocation_id: { type: string, nullable: true }
              ended: { type: boolean }
              completed: { type: boolean }
              reduced_before_cents: { type: integer }
              reduced_after_cents: { type: integer }
    CreditEventSummary:
      type: object
      required: [event, outstanding_cents, available_cents, reasons]
      properties:
        event:
          type: object
          required: [id, name, slug, ended_at]
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            ended_at: { type: string, format: date-time, nullable: true }
        outstanding_cents: { $ref: '#/components/schemas/PoolAmounts' }
        available_cents: { $ref: '#/components/schemas/PoolAmounts' }
        reasons:
          type: object
          required: [reward, poll, goal]
          properties:
            reward: { type: string, nullable: true }
            poll: { type: string, nullable: true }
            goal: { type: string, nullable: true }
    CreditCatalogTarget:
      type: object
      required: [id, title, channel]
      properties:
        id: { type: string }
        title: { type: string }
        channel:
          type: object
          nullable: true
          required: [id, name, slug]
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
    CreditEvent:
      allOf:
        - { $ref: '#/components/schemas/CreditEventSummary' }
        - type: object
          required: [catalog, history]
          properties:
            catalog:
              type: object
              required: [rewards, polls, goals]
              properties:
                rewards:
                  type: array
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/CreditCatalogTarget' }
                      - type: object
                        required: [cost_cents, type, remaining]
                        properties:
                          cost_cents: { type: integer, minimum: 1 }
                          type: { type: string, enum: [DIGITAL, SHOUTOUT, CUSTOM] }
                          remaining: { type: integer, minimum: 1, nullable: true }
                polls:
                  type: array
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/CreditCatalogTarget' }
                      - type: object
                        required: [options, total_votes_cents]
                        properties:
                          total_votes_cents: { type: integer, minimum: 0 }
                          options:
                            type: array
                            items:
                              type: object
                              required: [id, label, votes_cents]
                              properties:
                                id: { type: string }
                                label: { type: string }
                                votes_cents: { type: integer, minimum: 0 }
                goals:
                  type: array
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/CreditCatalogTarget' }
                      - type: object
                        required: [current_cents, target_cents]
                        properties:
                          current_cents: { type: integer }
                          target_cents: { type: integer }
            history:
              type: array
              items:
                type: object
                required:
                  [
                    id,
                    donation_id,
                    category,
                    amount_cents,
                    remaining_cents,
                    created_at,
                    cleared_at,
                    origin,
                    redemptions,
                  ]
                properties:
                  id: { type: string }
                  donation_id: { type: string }
                  category: { type: string, enum: [reward, poll, goal] }
                  amount_cents: { type: integer, minimum: 1 }
                  remaining_cents: { type: integer, minimum: 0 }
                  created_at: { type: string, format: date-time }
                  cleared_at: { type: string, format: date-time, nullable: true }
                  origin:
                    type: object
                    required: [kind, id, title]
                    properties:
                      kind: { type: string, enum: [claim, vote, contribution] }
                      id: { type: string }
                      title: { type: string }
                  redemptions:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          amount_cents,
                          reduced_cents,
                          effective_cents,
                          created_at,
                          allocation_id,
                          reversed,
                        ]
                      properties:
                        id: { type: string }
                        amount_cents:
                          { type: integer, minimum: 1, description: Original immutable consumption }
                        reduced_cents:
                          {
                            type: integer,
                            minimum: 0,
                            description: Audited Payment-refund reduction,
                          }
                        effective_cents:
                          {
                            type: integer,
                            minimum: 0,
                            description: Original consumption minus reduction; the only restorable funding,
                          }
                        created_at: { type: string, format: date-time }
                        allocation_id: { type: string }
                        reversed: { type: boolean }
    CreditSelection:
      oneOf:
        - type: object
          required: [kind, target_id, quantity, unit_price_cents, reward_type]
          properties:
            kind: { type: string, enum: [REWARD] }
            target_id: { type: string }
            quantity: { type: integer, minimum: 1, maximum: 1000 }
            unit_price_cents: { type: integer, minimum: 1 }
            reward_type: { type: string, enum: [DIGITAL, SHOUTOUT, CUSTOM] }
        - type: object
          required: [kind, target_id, poll_id, amount_cents]
          properties:
            kind: { type: string, enum: [POLL_VOTE] }
            target_id: { type: string }
            poll_id: { type: string }
            amount_cents: { type: integer, minimum: 1 }
        - type: object
          required: [kind, target_id, amount_cents]
          properties:
            kind: { type: string, enum: [GOAL] }
            target_id: { type: string }
            amount_cents: { type: integer, minimum: 1 }
    NativeRewardAllocation:
      type: object
      description: Safe native donation.created/updated allocation. Credit-funded whole claims appear source-locally; amount_cents is ONLY this donation's financial share. Count entitlement id once. Tiltify carries quantity 1 only under the stable oldest-source carrier. No email, actor or claim answers.
      required: [id, reward_id, amount_cents, status, source]
      properties:
        id: { type: string }
        reward_id: { type: string }
        amount_cents: { type: integer }
        status: { type: string }
        source: { type: string, enum: [donor] }
        entitlement_amount_cents:
          {
            type: integer,
            description: Full recorded unit price; present for redemption-backed claims,
          }
        carrier_donation_id:
          {
            type: string,
            description: Stable oldest funding source; present for redemption-backed claims,
          }
    UnusedPoolAmounts:
      type: object
      required: [poll, goal]
      additionalProperties: false
      properties:
        poll: { type: integer, minimum: 0 }
        goal: { type: integer, minimum: 0 }
    UnusedPoolWork:
      type: object
      required: [donations, cents]
      properties:
        donations: { type: integer, minimum: 0 }
        cents:
          $ref: '#/components/schemas/UnusedPoolAmounts'
    PoolAmounts:
      type: object
      required: [reward, poll, goal]
      additionalProperties: false
      properties:
        reward: { type: integer, minimum: 0 }
        poll: { type: integer, minimum: 0 }
        goal: { type: integer, minimum: 0 }
    PlannedSelection:
      type: object
      required:
        [
          kind,
          target_id,
          poll_id,
          amount_cents,
          insertion_order,
          quantity,
          unit_price_cents,
          reward_type,
          data,
        ]
      properties:
        kind: { type: string, enum: [REWARD, POLL_VOTE, POLL_CUSTOM, GOAL] }
        target_id: { type: string }
        poll_id: { type: string, nullable: true }
        amount_cents: { type: integer, minimum: 100 }
        insertion_order: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
        unit_price_cents: { type: integer, minimum: 1, nullable: true }
        reward_type:
          { type: string, nullable: true, enum: [DIGITAL, PHYSICAL, SHOUTOUT, CUSTOM, null] }
        data:
          {
            nullable: true,
            description: 'Opaque claim/write-in data; validated by the server, not the pure planner',
          }
    PledgePlan:
      type: object
      additionalProperties: false
      required:
        [
          pledge_amount_cents,
          selections,
          usage_cents,
          overage_cents,
          top_up_rows,
          wallet_applied_cents,
          new_money_cents,
          requires_shipping,
        ]
      properties:
        pledge_amount_cents: { type: integer, minimum: 100 }
        selections: { type: array, items: { $ref: '#/components/schemas/PlannedSelection' } }
        usage_cents: { $ref: '#/components/schemas/PoolAmounts' }
        overage_cents: { $ref: '#/components/schemas/PoolAmounts' }
        top_up_rows:
          type: array
          description: Flat poll/goal proportional auto amounts, largest remainder, insertion-order ties. No reward top-up.
          items:
            type: object
            required: [selection_index, amount_cents]
            properties:
              selection_index: { type: integer, minimum: 0 }
              amount_cents: { type: integer, minimum: 1 }
        wallet_applied_cents: { type: integer, minimum: 0 }
        new_money_cents: { type: integer, minimum: 0 }
        requires_shipping: { type: boolean }
    PledgeRead:
      oneOf:
        - { $ref: '#/components/schemas/PooledPledge' }
        - { $ref: '#/components/schemas/LegacyPledge' }
      discriminator: { propertyName: format }
    PledgeReadBase:
      type: object
      required:
        [
          format,
          pledge_token,
          status,
          expires_at,
          items,
          payment_state,
          can_edit,
          can_continue,
          read_only,
          admin_review_required,
          donate_url,
          has_checkout,
          comment,
          display_name,
          channel_id,
        ]
      properties:
        comment: { type: string, nullable: true, description: Immutable confirmed public message }
        display_name:
          { type: string, nullable: true, description: Immutable public name; null means Anonymous }
        channel_id: { type: string, nullable: true }
        payment_state:
          type: string
          enum:
            [READY, OPEN, PROCESSING, UNKNOWN, NON_PAYMENT, FULFILLED, LEGACY_PAID, PAYMENT_REVIEW]
          description: |
            READY has no known Stripe attempt; OPEN can pay the same Session.
            PROCESSING/UNKNOWN retain funding and forbid edits/new checkout.
            NON_PAYMENT is confirmed, not a local deadline. Only pooled NON_PAYMENT
            can edit. LEGACY_PAID is derived from a linked old-shape cash-only receipt,
            without D or incentives; raw status stays EXPIRED. Original historical
            FULFILLED pledges stay fulfilled.
            PAYMENT_REVIEW records actual cash as NULL-D Wallet credit when released
            Wallet funding cannot be reacquired in full. It is NOT pledge fulfillment.
        can_edit: { type: boolean }
        can_continue: { type: boolean }
        read_only: { type: boolean }
        admin_review_required: { type: boolean }
        donate_url: { type: string, nullable: true }
        has_checkout: { type: boolean }
        pledge_token: { type: string }
        status:
          type: string
          enum: [OPEN, FULFILLED, EXPIRED, CANCELLED, LEGACY_PAID, PAYMENT_REVIEW]
          description: |
            Stored pledge status, not its derived payment_state. Late LEGACY receipts
            stay EXPIRED. LEGACY_PAID is accepted only for previously stored dev records.
        expires_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [REWARD, POLL_VOTE, POLL_CUSTOM, GOAL] }
              target_id: { type: string }
              poll_id: { type: string, nullable: true }
              amount_cents: { type: integer }
              quantity: { type: integer }
              source: { type: string, enum: [donor, auto] }
              unit_price_cents: { type: integer, nullable: true }
              confirmed_reward_type: { type: string, nullable: true }
              data: { type: string, nullable: true, description: JSON string }
    PooledPledge:
      allOf:
        - { $ref: '#/components/schemas/PledgeReadBase' }
        - type: object
          required:
            [
              draft_id,
              pledge_amount_cents,
              wallet_applied_cents,
              new_money_cents,
              requires_shipping,
              plan,
            ]
          properties:
            format: { type: string, enum: [POOLED] }
            draft_id: { type: string }
            pledge_amount_cents: { type: integer }
            wallet_applied_cents: { type: integer }
            new_money_cents: { type: integer }
            requires_shipping: { type: boolean }
            plan: { $ref: '#/components/schemas/PledgePlan' }
    LegacyPledge:
      description: Historical read-only pledge; no new pledge amount or Pools.
      allOf:
        - { $ref: '#/components/schemas/PledgeReadBase' }
        - type: object
          required: [total_cents, top_up_cents]
          properties:
            format: { type: string, enum: [LEGACY] }
            total_cents: { type: integer }
            top_up_cents: { type: integer }
    DefaultGoals:
