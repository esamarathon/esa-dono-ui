      tags: [Admin]
      summary: Create a fund goal
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, target_cents]
              properties:
                title: { type: string }
                description: { type: string }
                target_cents: { type: integer }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
                  description: |
                    Owning Event (ADR-0012). With channel_id it must be that Channel's Event.
                    Without channel_id (a shared incentive) it defaults to the only Event;
                    when two or more Events exist it is required.
                is_active: { type: boolean, default: true }
      responses:
        '200':
          description: Goal created

  /admin/goals/{id}:
    put:
      tags: [Admin]
      summary: Update a fund goal
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                target_cents: { type: integer }
                channel_id: { type: string, nullable: true }
                event_id:
                  type: string
                  description: Must be the current Event; an incentive never moves to another Event (ADR-0012).
                is_active: { type: boolean }
      responses:
        '200':
          description: Goal updated; completion derives from current allocation versus target on target edits
        '400': { description: Invalid input or supplied manual is_complete }
        '409':
          { description: Channel change with allocation history or a Default goal list reference }
    delete:
      tags: [Admin]
      summary: Reverse contributions and deactivate a fund goal
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removed after refunding unreversed contributions; historical records are preserved

  /admin/goals/{id}/refund:
    post:
      tags: [Admin]
      summary: Reverse all live contributions to a fund goal
      description: Pooled donor/auto funding becomes goal Pool credit; moderator funding becomes Unused pool money. Legacy/unlinked rows receive Wallet REFUND; old CHARGEBACK rows receive zero. Goal completion is recomputed against its target. REQUESTED Payment refunds block conflicts.
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Contributions reversed to their original destinations. Pooled rows create no BalanceAdjustment; legacy/unlinked Wallet refunds record REFUND adjustments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  refunded_count: { type: integer }
                  refunded_cents: { type: integer }

