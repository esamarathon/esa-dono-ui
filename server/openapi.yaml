          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_entries: { type: integer }
                  active_polls: { type: integer }
                  total_rewards: { type: integer }
                  total_goals: { type: integer }
                  unused_pool:
                    type: object
                    description: Distinct donations with positive Unused poll or goal cents, for Events not ended; comments must be nonblank. No donor email.
                    required: [with_comment, all]
                    properties:
                      with_comment:
                        $ref: '#/components/schemas/UnusedPoolWork'
                      all:
                        $ref: '#/components/schemas/UnusedPoolWork'

  /moderator/events:
    get:
      tags: [Moderator]
      summary: List all events
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      responses:
        '200':
          description: All Events ordered by created_at ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      tags: [Moderator]
      summary: Create an event
      description: |
        Creates an Event. `slug` is optional; when omitted it is derived from
        `name` and made unique across Events and Channels. New Events start
        inactive — activating one requires a primary Channel of that same Event.
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug:
                  type: string
                  description: Optional. Lowercase URL- and AMQP-routing-safe name; derived from `name` when omitted.
                is_active: { type: boolean, default: false }
                primary_channel_id: { type: string, nullable: true }
      responses:
        '200':
          description: The created Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400':
          description: Missing name, invalid slug, or non-boolean is_active
        '409':
          description: Name or slug already in use, or activation without a valid primary Channel

  /moderator/events/{id}:
    put:
      tags: [Moderator]
      summary: Update an event
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                is_active: { type: boolean }
                primary_channel_id: { type: string, nullable: true }
      responses:
        '200':
          description: The updated Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400':
          description: Empty name, invalid slug, non-boolean is_active, or a primary Channel belonging to another Event
        '404':
          description: Event not found
        '409':
          description: Slug change on an active event, activation without an active primary channel, clearing the primary channel of an active event, or duplicate name/slug
    delete:
      tags: [Moderator]
      summary: Deactivate an event
      description: Soft-delete — sets is_active false rather than removing the row, since Channels/incentives/donations/pledges may still reference it.
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The deactivated Event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  event: { $ref: '#/components/schemas/Event' }
        '404':
          description: Event not found

