      responses:
        '200':
          description: All endpoints ordered by created_at descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDestination'
    post:
      tags: [Admin]
      summary: Create a Destination
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destination_type:
                  type: string
                  enum: [HTTP, RABBITMQ]
                  default: HTTP
                url: { type: string, format: uri, description: 'Required for HTTP endpoints' }
                secret: { type: string, description: 'Optional. Auto-generated if omitted.' }
                event_types:
                  type: array
                  items:
                    type: string
                    enum:
                      [
                        donation.created,
                        donation.updated,
                        donation.moderated,
                        donation.hidden,
                        donation.unhidden,
                        incentive.created,
                        incentive.enabled,
                        incentive.disabled,
                        incentive.value_changed,
                      ]
                verify_ssl: { type: boolean, default: true }
                description: { type: string }
                amqp_url:
                  {
                    type: string,
                    description: 'Required for RabbitMQ endpoints. Must be amqp:// or amqps://',
                  }
                amqp_exchange:
                  {
                    type: string,
                    description: "Default '' for NATIVE (the default exchange); 'tiltify' for TILTIFY",
                  }
                amqp_routing_key:
                  { type: string, description: 'Required for NATIVE RabbitMQ Destinations only' }
                payload_format:
                  type: string
                  enum: [NATIVE, TILTIFY]
                  default: NATIVE
                  description: 'NATIVE: our envelope {id,type,created_at,data}. TILTIFY: bare Tiltify-v5 objects for kollekt and esa-layouts-v2; requires destination_type RABBITMQ (400 otherwise); ignores event_types and amqp_routing_key (routing keys are <channel-slug>.donation and <slug>.fact.updated); exchange defaults to tiltify.'
