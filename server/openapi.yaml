openapi: '3.0.3'
info:
  title: ESA Dono API
  description: |
    Donation platform with Stripe checkout, wallet balance, pledge (smart cart)
    auto-fulfillment, rewards, polls, fund goals, channels, and moderator/admin tooling.

    ## Authentication

    Donor auth is held in an **httpOnly `dono_session` cookie** (ADR 0004) so the
    credential is never readable by JS. The browser sends it automatically.
    Non-browser/API clients may instead present the donor magic token as
    `Authorization: Bearer <magic_token>`. Operational keys (admin/moderator) are
    operator secrets carried as prefixed Bearer credentials. The legacy `?token=`
    query param and `X-Admin-Key`/`X-Moderator-Key` headers have been removed.

    | Method | Transport | Used By |
    |--------|-----------|---------|
    | Donor session (browser) | `dono_session` httpOnly cookie (SameSite=Lax) | Donor wallet, spend endpoints, moderator |
    | Donor token (API) | `Authorization: Bearer <magic_token>` (or `Bearer donor_<magic_token>`) | Scripts / non-browser donor auth |
    | Admin key | `Authorization: Bearer key_admin_<ADMIN_API_KEY>` | Admin routes; also a fallback for moderator routes |
    | Moderator key | `Authorization: Bearer key_mod_<MODERATOR_API_KEY>` | Fallback access to moderator routes, independent of donor roles |
    | Moderator/Admin role | Donor session/token + `role: MODERATOR`/`ADMIN` on donor record | Moderator routes (ADMIN implies MODERATOR access) |
    | Stripe webhook | HMAC signature via `stripe-signature` header | Stripe webhook (skipped when `STRIPE_WEBHOOK_SECRET` unset) |

    A donor logs in by opening a magic link (`GET /api/auth/magic?token=…`, which
    sets the cookie and redirects) or via OAuth; the token never appears in the
    SPA URL. `POST /api/auth/session` exchanges a pasted token for the cookie and
    `POST /api/auth/session/logout` clears it.

    ## Rate Limiting

    Spend endpoints (`claim`, `vote`, `custom-entry`, `contribute`) are rate-limited:
    20 requests per minute, keyed by the donor token (session cookie or
    `Authorization: Bearer`) or IP. Configurable via `RATE_LIMIT_SPEND`.

    ## Channels

    Every donation routes to exactly one channel (`GET /api/channels` lists the active
    ones). Rewards, polls, and fund goals may be tied to a specific channel
    (`channel_id` set) or shared across all channels (`channel_id` null). `POST
    /api/pledge` requires `channel_id` and rejects any cart item whose incentive
    belongs to a different channel — incentives cannot be mixed across channels in
    a single donation. Channels are managed via `/api/admin/channels` and
    `/api/moderator/channels`; per-channel raised totals are admin-only
    (`GET /api/admin/stats`).

    ## Wallet Discount

    When `POST /api/pledge` receives a valid `?token=` (authenticated donor),
    the donor's `balance_remaining` is applied as a discount on the Stripe
    checkout amount. If the wallet covers the entire pledge total, the pledge
    is fulfilled directly without a Stripe charge. See the pledge endpoint for details.

    ## Money

    All monetary values are **integer cents**. Display values as `$X.XX` by dividing by 100.
  version: '1.0.0'

servers:
  - url: /api
    description: Production (same origin)
  - url: http://localhost:3001/api
    description: Local development

tags:
  - name: Health
  - name: Campaign
  - name: Donor
  - name: Auth
  - name: Rewards
  - name: Polls
  - name: Goals
  - name: Channels
  - name: Pledge
  - name: Webhook
  - name: Admin
  - name: Moderator

paths:
  # ─── Health ───
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  db: { type: boolean }
        '503':
          description: Database down
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: false }
                  db: { const: false }
                  error: { type: string }

  # ─── Campaign ───
  /campaign:
    get:
      tags: [Campaign]
      summary: Get campaign totals
      responses:
        '200':
          description: Campaign stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string }
                  amount_raised:
                    type: object
                    properties:
                      value: { type: string, description: 'Dollars formatted string' }
                  goal:
                    type: object
                    properties:
                      value: { type: string }

  # ─── Donor ───
  /donor:
    get:
      tags: [Donor]
      summary: Get current donor profile
      description: Returns the authenticated donor with nested donations, claims, votes, contributions, and custom entries.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Donor profile
        '401':
          description: Missing/invalid/expired token
        '403':
          description: Account frozen

  # ─── Auth ───
  /auth/request-token:
    post:
      tags: [Auth]
      summary: Request a new magic link by email
      description: |
        Rotates the donor's magic token (invalidating any prior link) and emails
        a fresh link. Responds uniformly for existing and unknown emails so the
        endpoint cannot be used to enumerate donors. Rate-limited by IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Request accepted (regardless of whether the email has donated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
        '400':
          description: Invalid email address
        '429':
          description: Rate limit exceeded

  /auth/session:
    post:
      tags: [Auth]
      summary: Exchange a magic token for an httpOnly session cookie
      description: |
        Validates a donor magic token (from a pasted magic link) and sets the
        `dono_session` httpOnly cookie, so the token never lives in JS-readable
        storage. Used by the manual "paste your link" login path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  email: { type: string, format: email }
        '400':
          description: Missing token
        '401':
          description: Invalid, expired, or frozen

  /auth/session/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie (logout)
      description: |
        Clears the `dono_session` cookie. The magic token itself is not rotated
        (the same link can sign back in); use request-token to rotate it.
      responses:
        '200':
          description: Session cookie cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }

  /auth/magic:
    get:
      tags: [Auth]
      summary: Magic-link landing (sets session cookie, redirects to wallet)
      description: |
        Magic-link target. Validates the token server-side, sets the
        `dono_session` httpOnly cookie, and 302s to the wallet — so the token
        never reaches the SPA or the browser URL/history.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the wallet (with error query param on failure)

  /auth/providers:
    get:
      tags: [Auth]
      summary: List configured OAuth sign-in providers
      responses:
        '200':
          description: Providers with client credentials configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: string
                      enum: [google, discord, twitch]

  /auth/{provider}:
    get:
      tags: [Auth]
      summary: Begin an OAuth sign-in
      description: |
        Redirects the browser to the provider's authorize URL and sets a CSRF
        state cookie. The browser is then redirected back to the callback.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, discord, twitch]
      responses:
        '302':
          description: Redirect to the provider's authorize URL
        '404':
          description: Unknown provider
        '503':
          description: Provider not configured

  /auth/{provider}/callback:
    get:
      tags: [Auth]
      summary: OAuth sign-in callback
      description: |
        Verifies state, exchanges the authorization code for a verified email,
        upserts the donor (creating an empty one on first sign-in), and
        redirects to the wallet with a fresh magic token. On failure redirects
        to the wallet with an `error` query param.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, discord, twitch]
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the wallet (with token or error)
        '404':
          description: Unknown provider

  # ─── Rewards ───
  /rewards:
    get:
      tags: [Rewards]
      summary: List active rewards
      responses:
        '200':
          description: Active rewards ordered by cost_cents ascending

  /rewards/{id}/claim:
    post:
      tags: [Rewards]
      summary: Claim a reward
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                claim_data: {}
      responses:
        '200':
          description: Claim created
        '400':
          description: Insufficient balance / sold out / inactive
        '401':
          description: Token required
        '429':
          description: Rate limited

  # ─── Polls ───
  /polls:
    get:
      tags: [Polls]
      summary: List active polls
      responses:
        '200':
          description: Active polls with ACTIVE options ordered by votes_cents descending

  /polls/{id}/custom-entry:
    post:
      tags: [Polls]
      summary: Propose a custom poll option (funded write-in)
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, amount_cents]
              properties:
                label: { type: string, maxLength: 500 }
                amount_cents: { type: integer, minimum: 100 }
      responses:
        '200':
          description: Entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  entry: { type: object }
                  pending_approval: { type: boolean }
        '400':
          description: Validation error

  /polls/{id}/vote:
    post:
      tags: [Polls]
      summary: Vote in a poll
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poll_option_id, amount_cents]
              properties:
                poll_option_id: { type: string }
                amount_cents: { type: integer, minimum: 100 }
      responses:
        '200':
          description: Vote recorded

  # ─── Goals ───
  /goals:
    get:
      tags: [Goals]
      summary: List active fund goals
      responses:
        '200':
          description: Active goals ordered by created_at descending

  /goals/{id}/contribute:
    post:
      tags: [Goals]
      summary: Contribute to a fund goal
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents: { type: integer, minimum: 100 }
      responses:
        '200':
          description: Contribution recorded

  # ─── Channels ───
  /channels:
    get:
      tags: [Channels]
      summary: List active channels
      description: |
        Every donation is routed to exactly one channel (for correct overlay
        routing). Rewards, polls, and fund goals may be tied to a specific
        channel (`channel_id` set) or shared across all channels (`channel_id`
        null). Used by the /donate channel picker.
      responses:
        '200':
          description: Active channels ordered by created_at ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    is_active: { type: boolean }

  # ─── Pledge ───
  /pledge:
    post:
      tags: [Pledge]
      summary: Create a pending pledge (smart cart)
      description: |
        Creates a pending pledge from cart items and (when Stripe is configured)
        a Stripe Checkout Session. When a valid donor token is provided via
        `?token=`, the donor's wallet balance is applied as a discount.

        **Channels:** every pledge is routed to exactly one channel via the
        required `channel_id` (used to route the donation to the correct
        overlay). Each cart item's underlying reward/poll/goal must either be
        shared (its own `channel_id` is null) or match the pledge's
        `channel_id` — incentives cannot be mixed across channels in a single
        transaction.

        **Wallet discount flow:**
        - `?token=` present & valid → donor's `balance_remaining` deducted from Stripe charge
        - Wallet ≥ pledge total → pledge fulfilled immediately, redirected to wallet
        - Wallet < pledge total → Stripe charges only `total - discount` (min 50 cents)
        - No `?token=` → no discount applied
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: Optional donor magic token for wallet discount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, channel_id]
              properties:
                email:
                  type: string
                  format: email
                  description: Donor email (for Stripe pre-fill and magic link delivery)
                comment:
                  type: string
                  maxLength: 500
                channel_id:
                  type: string
                  description: Required. The channel this donation is routed to.
                top_up_cents:
                  type: integer
                  minimum: 0
                  description: Optional additional donation beyond cart items (credited as wallet balance)
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [kind, target_id]
                    properties:
                      kind:
                        type: string
                        enum: [REWARD, POLL_VOTE, GOAL, POLL_CUSTOM]
                      target_id:
                        type: string
                        description: reward_id | poll_option_id | goal_id | poll_id (POLL_CUSTOM)
                      amount_cents:
                        type: integer
                        description: Required for POLL_VOTE, GOAL, POLL_CUSTOM (min 100)
                      poll_id:
                        type: string
                        description: Required for POLL_VOTE and POLL_CUSTOM
                      data:
                        description: Claim data for REWARD, { label } for POLL_CUSTOM
      responses:
        '200':
          description: Pledge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge_token: { type: string }
                  total_cents: { type: integer }
                  expires_at: { type: string, format: date-time }
                  donate_url: { type: string, nullable: true }
                  has_checkout: { type: boolean }
                  wallet_discount_cents: { type: integer, default: 0 }
        '400':
          description: Validation error (invalid items, blocked words, empty cart)

  /pledge/{token}:
    get:
      tags: [Pledge]
      summary: Get pledge status
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pledge details
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge_token: { type: string }
                  total_cents: { type: integer }
                  top_up_cents: { type: integer }
                  status:
                    type: string
                    enum: [OPEN, FULFILLED, EXPIRED, CANCELLED]
                  donor_email: { type: string, nullable: true }
                  expires_at: { type: string, format: date-time }
                  magic_token:
                    type: string
                    nullable: true
                    description: Donor's magic token (present when FULFILLED)
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        target_id: { type: string }
                        amount_cents: { type: integer }
        '404':
          description: Pledge not found

  # ─── Webhook ───
  /webhooks/stripe:
    post:
      tags: [Webhook]
      summary: Stripe webhook receiver
      description: |
        Receives raw JSON body (mounted before `express.json()`).
        Only processes `checkout.session.completed` events.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Event received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { const: true }
        '400':
          description: Invalid signature

  # ─── Admin ───
  /admin/stats:
    get:
      tags: [Admin]
      summary: Admin dashboard stats
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: Aggregated stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  donors: { type: integer }
                  donations: { type: integer }
                  claims: { type: integer }
                  pledges: { type: integer }
                  total_raised_cents: { type: integer }
                  channels:
                    type: array
                    description: Per-channel raised totals (admin-only; not shown publicly)
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        raised_cents: { type: integer }
                        donations: { type: integer }

  /admin/channels:
    get:
      tags: [Admin]
      summary: List all channels
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: All channels ordered by created_at ascending
    post:
      tags: [Admin]
      summary: Create a channel
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                is_active: { type: boolean, default: true }
      responses:
        '200':
          description: Channel created
        '409':
          description: Channel name already exists

  /admin/channels/{id}:
    put:
      tags: [Admin]
      summary: Update a channel
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                is_active: { type: boolean }
      responses:
        '200':
          description: Channel updated
    delete:
      tags: [Admin]
      summary: Deactivate a channel
      description: Soft-delete — sets is_active false rather than removing the row, to preserve references from incentives/donations/pledges.
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Channel deactivated

  /admin/donations:
    get:
      tags: [Admin]
      summary: List all donations
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: Donations with donor email and channel (id, name), ordered by created_at descending

  /admin/claims:
    get:
      tags: [Admin]
      summary: List all reward claims
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: Claims with reward and donor email

  /admin/claims/{id}:
    patch:
      tags: [Admin]
      summary: Update claim status
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, FULFILLED]
      responses:
        '200':
          description: Claim updated

  /admin/rewards:
    get:
      tags: [Admin]
      summary: List all rewards
      security: [{ AdminKey: [] }]
      responses:
        '200':
          description: All rewards ordered by created_at descending
    post:
      tags: [Admin]
      summary: Create a reward
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type, cost_cents]
              properties:
                title: { type: string }
                description: { type: string }
                type:
                  type: string
                  enum: [DIGITAL, PHYSICAL, SHOUTOUT, CUSTOM]
                cost_cents: { type: integer }
                quantity_total: { type: integer, nullable: true }
                is_active: { type: boolean, default: true }
                custom_type_label: { type: string }
                channel_id: { type: string, nullable: true }
      responses:
        '200':
          description: Reward created

  /admin/rewards/{id}:
    put:
      tags: [Admin]
      summary: Update a reward
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                type: { type: string, enum: [DIGITAL, PHYSICAL, SHOUTOUT, CUSTOM] }
                cost_cents: { type: integer }
                quantity_total: { type: integer, nullable: true }
                is_active: { type: boolean }
                custom_type_label: { type: string }
                channel_id: { type: string, nullable: true }
      responses:
        '200':
          description: Reward updated
    delete:
      tags: [Admin]
      summary: Delete a reward
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted

  /admin/simulate-donation:
    post:
      tags: [Admin]
      summary: Simulate a donation (no real money)
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, amount_cents]
              properties:
                email: { type: string, format: email }
                donor_name: { type: string }
                amount_cents: { type: integer, minimum: 100 }
                comment: { type: string }
                pledge_token: { type: string }
                channel_id:
                  type: string
                  nullable: true
                  description: Optional channel to attribute this simulated donation to (bypasses the pledge flow's required-channel check).
      responses:
        '200':
          description: Donation simulated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  token: { type: string, description: 'Donor magic token' }
                  donor:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      balance_remaining: { type: integer }
                  pledge: { type: object, nullable: true }

  /admin/donors:
    get:
      tags: [Admin]
      summary: List donors
      security: [{ AdminKey: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Search by email
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: Pagination offset
      responses:
        '200':
          description: Paginated donor list (capped at 50)

    post:
      tags: [Admin]
      summary: Create a donor account without a prior donation
      description: >-
        Lets an admin provision a donor record ahead of time (e.g. to grant
        MODERATOR/ADMIN role before the person has donated). The donor can
        later log in via a regenerated magic-link token or via SSO with a
        matching email.
      security: [{ AdminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { type: string, enum: [USER, MODERATOR, ADMIN] }
      responses:
        '200':
          description: Donor created
        '400':
          description: Missing email or invalid role
        '409':
          description: Donor with this email already exists

  /admin/donors/{id}:
    get:
      tags: [Admin]
      summary: Get donor details
      security: [{ AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
