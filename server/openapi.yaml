openapi: '3.0.3'
info:
  title: ESA Dono API
  description: |
    Donation platform with amount-first pledges, independent incentive Pools,
    held Wallet funding, Stripe checkout, rewards, polls, fund goals, Channels,
    and moderator/admin tooling.

    ## Authentication

    Donor auth is held in an **httpOnly `dono_session` cookie** (ADR 0004) so the
    credential is never readable by JS. The browser sends it automatically.
    Non-browser/API clients may instead present the donor magic token as
    `Authorization: Bearer <magic_token>`. Operational keys (admin/moderator) are
    operator secrets carried as prefixed Bearer credentials. The legacy `?token=`
    query param and `X-Admin-Key`/`X-Moderator-Key` headers have been removed.

    | Method | Transport | Used By |
    |--------|-----------|---------|
    | Donor session (browser) | `dono_session` httpOnly cookie (SameSite=Lax) | Donor wallet, spend endpoints, moderator |
    | Donor token (API) | `Authorization: Bearer <magic_token>` (or `Bearer donor_<magic_token>`) | Scripts / non-browser donor auth |
    | Admin key | `Authorization: Bearer key_admin_<ADMIN_API_KEY>` | Admin routes; also a fallback for moderator routes |
    | Moderator key | `Authorization: Bearer key_mod_<MODERATOR_API_KEY>` | Fallback access to moderator routes, independent of donor roles |
    | Moderator/Admin role | Donor session/token + `role: MODERATOR`/`ADMIN` on donor record | Moderator routes (ADMIN implies MODERATOR access) |
    | Stripe webhook | HMAC signature via `stripe-signature` header | Stripe webhook (skipped when `STRIPE_WEBHOOK_SECRET` unset) |

    A donor logs in by opening a magic link (`GET /api/auth/magic?token=…`, which
    sets the cookie and redirects) or via OAuth; the token never appears in the
    SPA URL. `POST /api/auth/session` exchanges a pasted token for the cookie and
    `POST /api/auth/session/logout` clears it.

    ## Rate Limiting

    Spend endpoints (`claim`, `vote`, `custom-entry`, `contribute`) are rate-limited:
    20 requests per minute, keyed by the donor token (session cookie or
    `Authorization: Bearer`) or IP. Configurable via `RATE_LIMIT_SPEND`.

    ## Channels

    Every pledge routes to exactly one Channel (`GET /api/channels` lists the active
    ones); a donation without a pledge may remain unassigned until admin routing.
    Every reward, poll, fund goal and auction belongs to one Event (`event_id`,
    ADR-0012). It also belongs to one Channel (`channel_id` set), or it is shared
    by every Channel of its Event (`channel_id` null), and by no other Event. `POST /api/pledge` requires `channel_id`; removed
    foreign selections return a corrected review (409), with no pledge or hold.
    Later category Pool-credit spending can fund another Channel's incentives within
    the same Event, or shared incentives, without changing donation routing. Ordinary
    Tiltify lists/poll detail remain own/shared; optional ESA lookup envelopes alone
    resolve same-Event/shared owners. Channels are managed via `/api/admin/channels` and
    `/api/moderator/channels`; per-Channel staff stats are admin-only
    (`GET /api/admin/stats`), while Tiltify campaign reads expose public money totals.

    ## Wallet funding and Pools

    `POST /api/pledge` confirms a pledge amount and a shared deterministic plan.
    A valid donor session can fund it with available Wallet credit, held atomically
    at confirmation. Physical rewards require new money. A Wallet-only pledge
    adds zero money; shipping is a separate fee. Each incentive category has its
    own Pool equal to the pledge amount; incentive totals are not money totals.

    ## Staff incentive validation

    Both staff roles share transactional incentiveLifecycle validation. Titles and option labels
    are trimmed and nonempty. Reward prices and goal targets must be positive safe integer cents
    representable by Prisma Int (maximum 2147483647). Stock is a nonnegative representable integer
    or null (unlimited); zero may close future availability even with claims. Channel ids must be
    null or valid. Channel/reward-type changes with any live or reversed allocation history return
    409; malformed input returns 400. Manual goal is_complete input is rejected on create/update;
    completion is derived on actual target changes (unchanged targets/text edits retain existing exceptions).
    Staff incentive list reads add allocated_cents, allocated_source_cents (donor/auto/moderator)
    and live_count. These sum recorded effective financial components and count reward entitlements once,
    never current catalog price times count or a cross-category money total.
    Ordinary reversals recompute completion; chargeback and
    Payment-refund shrink preserve their existing completion exceptions. Staff deactivate to close early.

    ## Money

    All monetary values are **integer cents**. Display values as `$X.XX` by dividing by 100.
  version: '0.3.0'

servers:
  - url: /api
    description: Production (same origin)
  - url: http://localhost:3001/api
    description: Local development

tags:
  - name: Health
  - name: Campaign
  - name: Donor
  - name: Auth
  - name: Rewards
  - name: Polls
  - name: Goals
  - name: Channels
  - name: Pledge
  - name: Webhook
  - name: Admin
  - name: Moderator
  - name: Tiltify
    description: Tiltify-compatible read API for kollekt and esa-layouts-v2 (PRD-0002 §R)

paths:
  # ─── Health ───
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  db: { type: boolean }
        '503':
          description: Database down
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { enum: [false] }
                  db: { enum: [false] }
                  error: { type: string }

  # ─── Campaign ───
  /campaign:
    get:
      tags: [Campaign]
      summary: Get campaign totals
      responses:
        '200':
          description: Campaign stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string }
                  amount_raised:
                    type: object
                    description: One overall total. Counts COMPLETED and REFUNDED donations (refunds go to the donor's wallet), not CHARGEBACK or PENDING; hidden donations count.
                    properties:
                      value: { type: string, description: 'Dollars formatted string' }
                  goal:
                    type: object
                    properties:
                      value: { type: string }

  /campaign/broadcast:
    get:
      tags: [Campaign]
      summary: Get the active site-wide broadcast banner message, if any
      responses:
        '200':
          description: Active broadcast message, or null if none/inactive
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, nullable: true }
                  level:
                    type: string
                    nullable: true
                    enum: [INFO, WARNING, CRITICAL]
                    description: Banner severity; null uses the original fixed style

  # ─── Donor ───
  /donor:
    get:
      tags: [Donor]
      summary: Get current donor profile
      description: Returns the authenticated donor with nested donations (including each donation's channel, #53), claims, votes, contributions, and custom entries.
      security: [{ DonorSession: [] }, { DonorBearer: [] }]
      responses:
        '200':
          description: Donor profile
        '401':
          description: Missing/invalid/expired token
        '403':
          description: Account frozen

  /donor/pool-credits:
    get:
      tags: [Donor]
      summary: Combined category Pool credit per Event, with separate available Wallet credit
      security: [{ DonorSession: [] }, { DonorBearer: [] }]
      responses:
        '200':
          description: Safe current summaries; no actor, email, claim answers or source selection
          content:
            application/json:
              schema:
                type: object
                required: [wallet_credit_cents, events]
                properties:
                  wallet_credit_cents: { type: integer, minimum: 0 }
                  events:
                    { type: array, items: { $ref: '#/components/schemas/CreditEventSummary' } }
        '401': { description: Missing or invalid donor session }
        '403': { description: Frozen donor }
  /donor/pool-credits/{eventId}:
    get:
      tags: [Donor]
      summary: Safe Pool credit catalog and source history for one Event
      description: Includes any open own-Event Channel or shared incentive, never physical rewards. Positive unspendable credit remains visible with a reason. Ended reward credit expires; ended poll/goal credit is derived Unused pool money. Choices are not stored here.
      security: [{ DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Category credit, catalog and immutable source/redemption history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditEvent' }
        '401': { description: Missing or invalid donor session }
        '403': { description: Frozen donor }
        '404': { description: Event not found }
  /donor/pool-credits/{eventId}/apply:
    post:
      tags: [Donor]
      summary: Atomically apply one reviewed Pool credit batch
      description: |
        Any positive poll/goal cents and whole nonphysical reward units at current price/stock.
        Combined category budgets must match the reviewed totals. Partial spending is allowed;
        no auto-allocation or Wallet debit. Sources are drawn oldest donation (created_at/id),
        then oldest grant (created_at/id). A reward is ONE entitlement per unit, even when
        funded by several donations. Allocation and outbox writes commit or roll back together.
        Same donor/key/request retries return the original result BEFORE live comparison.
        Same key with different request/Event returns 409. Every affected source is published.
      security: [{ DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, reviewed_credit_cents, selections]
              properties:
                idempotency_key: { type: string, minLength: 1, maxLength: 200 }
                reviewed_credit_cents: { $ref: '#/components/schemas/PoolAmounts' }
                selections:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 100,
                    items: { $ref: '#/components/schemas/CreditSelection' },
                  }
      responses:
        '200':
          description: Original committed batch result, including replay
          content:
            application/json:
              schema:
                type: object
                required:
                  [batch_id, spent_cents, claim_ids, vote_ids, contribution_ids, donation_ids]
                properties:
                  batch_id: { type: string }
                  spent_cents: { $ref: '#/components/schemas/PoolAmounts' }
                  claim_ids:
                    {
                      type: array,
                      items: { type: string },
                      description: One id per whole reward unit,
                    }
                  vote_ids: { type: array, items: { type: string } }
                  contribution_ids: { type: array, items: { type: string } }
                  donation_ids:
                    {
                      type: array,
                      items: { type: string },
                      description: 'Financial sources, not changed routing',
                    }
        '400':
          {
            description: 'Invalid key, duplicate target, invalid category or nonpositive/noninteger allocation',
          }
        '401': { description: Missing or invalid donor session }
        '403': { description: Frozen donor }
        '404': { description: Event not found }
        '409':
          description: Reviewed credit/target/price/stock changed, wrong Event, physical reward, ended Event, unavailable or REQUESTED source, or reused key with different request. Nothing applied; refresh and reconfirm.
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        '429': { description: Spend rate limit }

  # ─── Auth ───
  /auth/request-token:
    post:
      tags: [Auth]
      summary: Request a new magic link by email
      description: |
        Rotates the donor's magic token (invalidating any prior link) and emails
        a fresh link. Responds uniformly for existing and unknown emails so the
        endpoint cannot be used to enumerate donors. Rate-limited by IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Request accepted (regardless of whether the email has donated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { enum: [true] }
        '400':
          description: Invalid email address
        '429':
          description: Rate limit exceeded

  /auth/session:
    post:
      tags: [Auth]
      summary: Exchange a magic token for an httpOnly session cookie
      description: |
        Validates a donor magic token (from a pasted magic link) and sets the
        `dono_session` httpOnly cookie, so the token never lives in JS-readable
        storage. Used by the manual "paste your link" login path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { enum: [true] }
                  email: { type: string, format: email }
        '400':
          description: Missing token
        '401':
          description: Invalid, expired, or frozen

  /auth/session/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie (logout)
      description: |
        Clears the `dono_session` cookie. The magic token itself is not rotated
        (the same link can sign back in); use request-token to rotate it.
      responses:
        '200':
          description: Session cookie cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { enum: [true] }

  /auth/magic:
    get:
      tags: [Auth]
      summary: Magic-link landing (sets session cookie, redirects to wallet)
      description: |
        Magic-link target. Validates the token server-side, sets the
        `dono_session` httpOnly cookie, and 302s to the wallet — so the token
        never reaches the SPA or the browser URL/history.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the wallet (with error query param on failure)

  /auth/providers:
    get:
      tags: [Auth]
      summary: List configured OAuth sign-in providers
      responses:
        '200':
          description: Providers with client credentials configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: string
                      enum: [google, discord, twitch]

  /auth/{provider}:
    get:
      tags: [Auth]
      summary: Begin an OAuth sign-in
      description: |
        Redirects the browser to the provider's authorize URL and sets a CSRF
        state cookie. The browser is then redirected back to the callback.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, discord, twitch]
      responses:
        '302':
          description: Redirect to the provider's authorize URL
        '404':
          description: Unknown provider
        '503':
          description: Provider not configured

  /auth/{provider}/callback:
    get:
      tags: [Auth]
      summary: OAuth sign-in callback
      description: |
        Verifies state, exchanges the authorization code for a verified email,
        upserts the donor (creating an empty one on first sign-in), and
        redirects to the wallet with a fresh magic token. On failure redirects
        to the wallet with an `error` query param.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, discord, twitch]
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the wallet (with token or error)
        '404':
          description: Unknown provider

  # ─── Rewards ───
  /rewards:
    get:
      tags: [Rewards]
      summary: List active rewards
      responses:
        '200':
          description: Active rewards ordered by cost_cents ascending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reward' }

  /rewards/{id}/claim:
    post:
      tags: [Rewards]
      summary: Claim a reward
      security: [{ DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                claim_data: {}
                quantity:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Number of units of this reward to claim in one call. Decrements quantity_total by this amount and creates one RewardClaim row per unit (claim_data is shared across all of them).
      responses:
        '200':
          description: Claim created
        '400':
          description: Insufficient balance / sold out / inactive
        '401':
          description: Token required
        '429':
          description: Rate limited

  # ─── Polls ───
  /polls:
    get:
      tags: [Polls]
      summary: List active polls
      responses:
        '200':
          description: Active polls with ACTIVE options ordered by votes_cents descending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Poll' }

  /polls/{id}/custom-entry:
    post:
      tags: [Polls]
      summary: Propose a custom poll option (funded write-in)
      security: [{ DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, amount_cents]
              properties:
                label: { type: string, maxLength: 500 }
                amount_cents: { type: integer, minimum: 100 }
      responses:
        '200':
          description: Entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { enum: [true] }
                  entry: { type: object }
                  pending_approval: { type: boolean }
        '400':
          description: Validation error

  /polls/{id}/vote:
    post:
      tags: [Polls]
      summary: Vote in a poll
      security: [{ DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poll_option_id, amount_cents]
              properties:
                poll_option_id: { type: string }
                amount_cents: { type: integer, minimum: 100 }
      responses:
        '200':
          description: Vote recorded

  # ─── Goals ───
  /goals:
    get:
      tags: [Goals]
      summary: List active fund goals
      responses:
        '200':
          description: Active goals ordered by created_at descending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FundGoal' }

  /goals/{id}/contribute:
    post:
      tags: [Goals]
      summary: Contribute to a fund goal
      security: [{ DonorSession: [] }, { DonorBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents: { type: integer, minimum: 100 }
      responses:
        '200':
          description: Contribution recorded

  # ─── Auctions ───
  # Bids are non-binding commitments — no wallet deduction. At close, the
  # highest bidder is offered the item via a Stripe Checkout Session (24h
  # window); if unpaid it cascades to the next-highest bidder.
  /auctions:
    get:
      tags: [Auctions]
      summary: List active auctions
      parameters:
        - name: channel_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Active auctions ordered by ends_at ascending

  /auctions/{id}:
    get:
      tags: [Auctions]
      summary: Get auction detail with recent bid history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Auction detail
        '404':
          description: Auction not found

  /auctions/{id}/bid:
    post:
      tags: [Auctions]
      summary: Place a bid on an open auction
      description: |
        Requires a verified email and at least one prior completed donation.
        No balance is deducted — bids are commitments settled by the
        post-close payment cascade.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents: { type: integer }
      responses:
        '200':
          description: Bid placed

  # ─── Channels ───
  /channels:
    get:
      tags: [Channels]
      summary: List active channels
      description: |
        Every donation is routed to exactly one channel (for correct overlay
        routing). Rewards, polls, and fund goals may be tied to a specific
        channel (`channel_id` set) or shared by every channel of their Event
        (`channel_id` null, `event_id` set). Used by the /donate channel picker.
      responses:
        '200':
          description: Active channels ordered by created_at ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    slug:
                      type: string
                      description: Lowercase, URL- and AMQP-routing-safe name (PRD-0002 §S6)
                    event_id:
                      type: string
                      description: Id of the Event this Channel belongs to
                    is_active: { type: boolean }

  # ─── Events ───
  /events:
    get:
      tags: [Events]
      summary: List active events
      description: |
        Public list of active Events, each with its active Channels. The client
        uses this to drive the /donate event picker. Inactive Events and inactive Channels
        are omitted, and internal timestamp fields are not exposed.
      responses:
        '200':
          description: Active Events ordered by created_at ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicEvent'

  /events/{slug}:
    get:
      tags: [Events]
      summary: Get an active event by slug
      description: |
        Looks up one active Event by its slug, with its active Channels. Used by
        /donate/<event-slug> to preselect an Event. Inactive or unknown slugs
        both return 404 rather than leaking the existence of an inactive Event.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The Event and its active Channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
        '404':
          description: No active Event with that slug

  # ─── Tiltify-compatible read API (PRD-0002 §R, ADR-0010) ───
  /tiltify/campaigns/{id}:
    get:
      tags: [Tiltify]
      summary: Tiltify campaign (Channel) or team campaign (Event)
      description: |
        Public, read-only replacement for ESATiltifyBridge `GET /campaigns/{id}`,
        read by kollekt and esa-layouts-v2. A Channel has `team_id` = its Event id;
        an Event has `team_id: null`. `total_amount_raised` is the same number as
        the `<slug>.fact.updated` message (COMPLETED + REFUNDED donations).
        Inactive Channels and Events still resolve. Bare object (no `data` wrapper).
      parameters:
        - name: id
          in: path
          required: true
          description: A Channel id (Tiltify campaign) or an Event id (Tiltify team campaign)
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TiltifyCampaign'
        '404':
          description: Unknown Channel or Event id
        '429':
          description: Global API rate limit (RATE_LIMIT_API per minute per IP)

  /tiltify/campaign/{id}/rewards:
    get:
      tags: [Tiltify]
      summary: Rewards of a Tiltify campaign
      description: |
        Our Rewards. A Channel lists its own incentives plus the shared ones
        (no channel); an Event lists none (a shared incentive would otherwise
        appear twice for esa-layouts-v2, which concatenates Event and Channel lists).
        Deactivated incentives are listed with `active: false`. Bare array (no `data` wrapper).
      parameters:
        - name: id
          in: path
          required: true
          description: A Channel id (Tiltify campaign) or an Event id (Tiltify team campaign)
          schema: { type: string, format: uuid }
        - {
            name: limit,
            in: query,
            required: false,
            description: Accepted and ignored (every list is one page),
            schema: { type: integer },
          }
        - {
            name: after,
            in: query,
            required: false,
            description: Accepted and ignored,
            schema: { type: string },
          }
        - {
            name: before,
            in: query,
            required: false,
            description: Accepted and ignored,
            schema: { type: string },
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TiltifyReward'
        '404':
          description: Unknown Channel or Event id
        '429':
          description: Global API rate limit (RATE_LIMIT_API per minute per IP)

  /tiltify/campaign/{id}/targets:
    get:
      tags: [Tiltify]
      summary: Targets of a Tiltify campaign
      description: |
