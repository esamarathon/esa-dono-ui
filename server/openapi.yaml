        active: { type: boolean }
        amount: { $ref: '#/components/schemas/TiltifyAmount' }
        amount_raised: { $ref: '#/components/schemas/TiltifyAmount' }
        inserted_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TiltifyPoll:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean, description: Active and not past its end time }
        amount_raised: { $ref: '#/components/schemas/TiltifyAmount' }
        inserted_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        options:
          type: array
          description: Approved options only
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              amount_raised: { $ref: '#/components/schemas/TiltifyAmount' }
    EsaDonoRewardLookup:
      type: object
      required: [campaign_id, incentive]
      additionalProperties: false
      properties:
        campaign_id:
          type: string
          format: uuid
          description: |
            True owner, never the request context: the Channel UUID, or for a shared
            reward its Event UUID (the team campaign, ADR-0012). Never null.
        incentive: { $ref: '#/components/schemas/TiltifyReward' }
    EsaDonoTargetLookup:
      type: object
      required: [campaign_id, incentive]
      additionalProperties: false
      example:
        campaign_id: eeeeeeee-0000-4000-8000-000000000001
        incentive:
          id: dddddddd-0000-4000-8000-000000000001
          name: Blindfolded run
          active: true
          amount: { currency: USD, value: '600.00' }
          amount_raised: { currency: USD, value: '15.00' }
          inserted_at: '2026-01-24T18:30:00.000Z'
          updated_at: '2026-01-24T18:30:00.000Z'
      properties:
        campaign_id:
          type: string
          format: uuid
          description: |
            True owner, never the request context: the Channel UUID, or for a shared
            target its Event UUID (the team campaign, ADR-0012). Never null.
        incentive: { $ref: '#/components/schemas/TiltifyTarget' }
    EsaDonoPollLookup:
      type: object
      required: [campaign_id, incentive]
      additionalProperties: false
      properties:
        campaign_id:
          type: string
          format: uuid
          description: |
            True owner, never the request context: the Channel UUID, or for a shared
            poll its Event UUID (the team campaign, ADR-0012). Never null.
        incentive: { $ref: '#/components/schemas/TiltifyPoll' }
    UnusedDonation:
      type: object
      description: Safe projection; no donor email, private claim data or Pool credit.
      properties:
        id: { type: string }
        donor_name: { type: string, nullable: true }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        channel_id: { type: string, nullable: true }
        event:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            ended_at: { type: string, format: date-time, nullable: true }
        unused_cents:
          type: object
          properties:
            poll: { type: integer }
            goal: { type: integer }
        assignments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              category: { type: string, enum: [poll, goal] }
              label: { type: string }
              amount_cents: { type: integer }
              allocated_at: { type: string, format: date-time, nullable: true }
              can_undo: { type: boolean }
    UnusedPicker:
      type: object
      properties:
        amount_cents: { type: integer }
        targets:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              channel_id: { type: string, nullable: true }
              before_cents: { type: integer }
              after_cents: { type: integer }
              target_cents: { type: integer, nullable: true }
    EventEndPreview:
      type: object
      properties:
        event_id: { type: string }
        slug: { type: string }
        action: { type: string, enum: [END, UNDO_END] }
        can_apply: { type: boolean }
        blockers: { type: array, items: { type: string } }
        pool_credit_cents:
          type: object
          properties:
            reward: { type: integer }
            poll: { type: integer }
            goal: { type: integer }
        unshipped_physical_donations:
          {
            type: integer,
            description: 'Distinct COMPLETED pooled donations with PENDING or CANCELLING physical claims; confirmed type takes precedence over live catalog type. Credit-funded claims have no physical-refund window.',
          }
        open_pledges: { type: integer }
        requested_payment_refunds: { type: integer }
        consuming_assignments:
          type: array
          items:
            type: object
            properties:
              donation_id: { type: string }
              category: { type: string, enum: [poll, goal] }
              assignment_ids: { type: array, items: { type: string } }
    Event:
      type: object
      description: A charity event (a marathon, or a one-day stream event) that owns Channels. Deactivation does not end it. Reactivation is blocked while ended_at is set.
      properties:
        id: { type: string }
        name: { type: string }
        slug:
          type: string
          description: Lowercase, URL- and AMQP-routing-safe name; unique across Events and Channels (PRD-0002 §S6)
        is_active: { type: boolean }
        ended_at: { type: string, format: date-time, nullable: true }
        ended_by: { type: string, nullable: true }
        end_undone_at: { type: string, format: date-time, nullable: true }
        end_undone_by: { type: string, nullable: true }
        primary_channel_id:
          {
            type: string,
            nullable: true,
            description: 'Where a donation that names no Channel is routed; must be a Channel of this Event',
          }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PublicEvent:
      type: object
      description: The public view of an active Event (routes/events.ts); no is_active or timestamps.
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        primary_channel_id: { type: string, nullable: true }
        channels:
          type: array
          description: Only this Event's active Channels, oldest first
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              slug: { type: string }
              event_id: { type: string }
              is_active: { type: boolean }
    WebhookDestination:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        secret:
          {
            type: string,
            description: 'Returned in full by the admin API (create, list, update); see #127. Use rotate-secret to replace it.',
          }
        is_active: { type: boolean }
        event_types:
          type: array
          items:
            type: string
            enum:
              [
                donation.created,
                donation.updated,
                donation.moderated,
                donation.hidden,
                donation.unhidden,
                incentive.created,
                incentive.enabled,
                incentive.disabled,
                incentive.value_changed,
              ]
        verify_ssl: { type: boolean }
        description: { type: string, nullable: true }
        destination_type:
          type: string
          enum: [HTTP, RABBITMQ]
          default: HTTP
        amqp_url:
          {
            type: string,
            nullable: true,
            description: 'Required for RabbitMQ endpoints. amqp:// or amqps://',
          }
        amqp_exchange:
          {
            type: string,
            description: "Default '' for NATIVE (the default exchange); 'tiltify' for TILTIFY",
          }
        amqp_routing_key:
          {
            type: string,
            nullable: true,
            description: 'Required for NATIVE RabbitMQ Destinations only',
          }
        payload_format:
          type: string
          enum: [NATIVE, TILTIFY]
          default: NATIVE
          description: 'NATIVE: our envelope {id,type,created_at,data}. TILTIFY: bare Tiltify-v5 objects for kollekt and esa-layouts-v2; requires destination_type RABBITMQ (400 otherwise); ignores event_types and amqp_routing_key (routing keys are <channel-slug>.donation and <slug>.fact.updated); exchange defaults to tiltify.'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        seq: { type: integer }
        message_id: { type: string }
        destination_id: { type: string }
        event_type: { type: string }
        routing_key:
          {
            type: string,
            nullable: true,
            description: "Per-message AMQP routing key (TILTIFY: <channel-slug>.donation); null uses the Destination's key",
          }
        payload: { type: string }
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        last_status_code: { type: integer, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
