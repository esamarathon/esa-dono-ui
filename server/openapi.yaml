              schema:
                $ref: '#/components/schemas/EsaDonoTargetLookup'
        '404':
          description: Unknown context or target, or the target owner belongs to another Event
        '429':
          description: Global API rate limit (RATE_LIMIT_API per minute per IP)

  /tiltify/campaign/{id}/lookup/polls/{poll_id}:
    get:
      tags: [Tiltify]
      summary: Optional ESA poll lookup within an Event
      description: |
        ESA-only capability, not an ordinary Tiltify endpoint. The context id is a
        known Channel or Event, including inactive history. The poll must be
        shared or owned by a Channel in that same Event. Returns its true owner, the
        Channel UUID or the Event UUID for a shared poll (ADR-0012), and the exact
