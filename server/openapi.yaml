          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug:
                  type: string
                  description: Only accepted while the Channel is inactive.
                event_id: { type: string }
                is_active: { type: boolean }
                default_goals: { $ref: '#/components/schemas/DefaultGoals' }
      responses:
        '200':
          description: Channel updated
        '400':
          description: Empty name, invalid slug, or unknown event_id
        '404':
          description: Channel not found
        '409':
          description: Slug change on an active channel, deactivating/moving the primary channel of an active event, duplicate name, or slug already in use
    delete:
      tags: [Moderator]
      summary: Deactivate a channel
      description: Soft-delete — sets is_active false rather than removing the row, to preserve references from incentives/donations/pledges.
      security: [{ DonorSession: [] }, { DonorBearer: [] }, { ModeratorKey: [] }, { AdminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Channel deactivated
          content:
            application/json:
              schema:
