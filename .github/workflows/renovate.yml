name: Renovate

on:
  schedule:
    - cron: '0 0 * * 1' # weekly
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      security-events: read
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46.3.14
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # RENOVATE_TOKEN is a user credential, not the repo-scoped GITHUB_TOKEN, so
          # autodiscovery would fan out to every repository that account can see and
          # fail on the first one without write access. Pin the single target repo.
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: '["esamarathon/esa-dono-ui"]'
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
