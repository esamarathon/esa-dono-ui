name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      - name: Push database schema
        run: npx prisma db push --accept-data-loss
        working-directory: server
        env:
          DATABASE_URL: 'file:./dev.db'

      - name: Run tests
        run: npm run test:ci
        env:
          DATABASE_URL: 'file:./dev.db'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      - name: Build client
        run: npm run build

  container-test:
    name: Container test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        env:
          ADMIN_API_KEY: ci-test-key
        run: docker compose -f docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          target: test
          tags: esa-dono-ui-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          target: runtime
          tags: ghcr.io/codescales/esa-dono-ui/backend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          tags: ghcr.io/codescales/esa-dono-ui/frontend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        run: docker run --rm esa-dono-ui-backend:test

      - name: Run CI mode in container
        run: docker run --rm -e MODE=ci esa-dono-ui-backend:test

      - name: Smoke-test running containers
        env:
          ADMIN_API_KEY: smoke-test-key
          FRONTEND_PORT: '18080'
        run: ./scripts/smoke-test.sh

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --verbose --no-git --config .gitleaks.toml
