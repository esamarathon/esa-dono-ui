name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate both Prisma clients
        run: npm run db:generate --workspace server

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate both Prisma clients
        run: npm run db:generate --workspace server

      - name: Run tests
        run: npm run test:ci

  test-postgresql:
    name: PostgreSQL current-schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dono_test
          POSTGRES_PASSWORD: dono_test
          POSTGRES_DB: dono_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dono_test -d dono_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The harness creates and drops only a unique schema inside this DB.
      TEST_DATABASE_URL: postgresql://dono_test:dono_test@localhost:5432/dono_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate both Prisma clients
        run: npm run db:generate --workspace server

      - name: Run full current-schema server suite
        run: npm run test --workspace server

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate both Prisma clients
        run: npm run db:generate --workspace server

      - name: Build client
        run: npm run build

  container-test:
    name: Container test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dono_test
          POSTGRES_PASSWORD: dono_test
          POSTGRES_DB: dono_runtime_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dono_test -d dono_runtime_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        env:
          ADMIN_API_KEY: ci-test-key
        run: docker compose -f docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          target: test
          tags: esa-dono-ui-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          target: runtime
          tags: ghcr.io/esamarathon/esa-dono-ui/backend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          tags: ghcr.io/esamarathon/esa-dono-ui/frontend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        run: docker run --rm esa-dono-ui-backend:test

      - name: Run CI mode in container
        run: docker run --rm -e MODE=ci esa-dono-ui-backend:test

      - name: Smoke-test runtime image with SQLite
        env:
          ADMIN_API_KEY: smoke-test-key
          DATABASE_URL: file:/data/dono.db
          FRONTEND_PORT: '18080'
          COMPOSE_PROJECT_NAME: dono-smoke-sqlite
        run: ./scripts/smoke-test.sh

      - name: Smoke-test the same runtime image with PostgreSQL
        env:
          DATABASE_URL: postgresql://dono_test:dono_test@localhost:5432/dono_runtime_smoke
          ADMIN_API_KEY: smoke-test-key
        run: |
          set -euo pipefail
          cleanup() {
            docker logs dono-postgresql-smoke || true
            docker rm -fv dono-postgresql-smoke || true
          }
          trap cleanup EXIT
          # Host networking reaches the job's published PostgreSQL service.
          # Reuse the already-built image; do not rebuild for another provider.
          docker run --detach --name dono-postgresql-smoke --network host \
            -e DATABASE_URL -e ADMIN_API_KEY \
            ghcr.io/esamarathon/esa-dono-ui/backend:latest
          wait_for_health() {
            for _ in $(seq 1 45); do
              if curl --fail --silent http://localhost:3001/api/health | jq -e '.ok == true'; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          wait_for_health
          curl --fail --silent --show-error http://localhost:3001/api/admin/stats \
            -H "Authorization: Bearer key_admin_${ADMIN_API_KEY}" | jq -e '.donors == 0'
          curl --fail --silent --show-error -X POST http://localhost:3001/api/admin/simulate-donation \
            -H "Authorization: Bearer key_admin_${ADMIN_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@test.com","amount_cents":2500}' | jq -e '.success == true'
          # Re-running migrate deploy must preserve data and start cleanly.
          docker restart dono-postgresql-smoke
          wait_for_health
          curl --fail --silent --show-error http://localhost:3001/api/admin/stats \
            -H "Authorization: Bearer key_admin_${ADMIN_API_KEY}" | jq -e '.donors == 1'

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --verbose --no-git --config .gitleaks.toml
