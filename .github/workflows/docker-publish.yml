name: Build and Push Docker Images

on:
  push:
    # Only branches whose images we actually want published & tagged.
    # (Feature/renovate/worktree branches build via the pull_request trigger
    # below once opened as a PR against main or dev, tagged pr-<number>.)
    branches: [main, dev]
    # Release tags (semver, no "v" prefix, e.g. 0.1.0). These do NOT rebuild:
    # the promote-release job re-tags the image CI already built and
    # smoke-tested for the tagged commit. Trivy runs separately on PRs.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/esamarathon/esa-dono-ui

jobs:
  build-and-push:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # Docker tags allow only [a-zA-Z0-9_.-]; branch names may contain
          # slashes (e.g. renovate/foo) or other characters, so sanitize.
          sanitize() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g' | sed -E 's#-+#-#g; s#^-|-$##g' | cut -c1-100
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            TAG="pr-${PR_NUMBER}"
            echo "backend_tags=${IMAGE_PREFIX}/backend:${TAG}" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${IMAGE_PREFIX}/frontend:${TAG}" >> "$GITHUB_OUTPUT"
            echo "run_smoke_test=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH_TAG="$(sanitize "$REF_NAME")"
            # The smoke test verifies this exact sha tag, not a mutable branch
            # tag, so every push gets one regardless of branch.
            BACKEND_TAGS="${IMAGE_PREFIX}/backend:${BRANCH_TAG},${IMAGE_PREFIX}/backend:${SHA}"
            FRONTEND_TAGS="${IMAGE_PREFIX}/frontend:${BRANCH_TAG},${IMAGE_PREFIX}/frontend:${SHA}"
            if [ "$REF_NAME" = "main" ]; then
              BACKEND_TAGS="${BACKEND_TAGS},${IMAGE_PREFIX}/backend:latest"
              FRONTEND_TAGS="${FRONTEND_TAGS},${IMAGE_PREFIX}/frontend:latest"
            fi
            echo "backend_tags=${BACKEND_TAGS}" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${FRONTEND_TAGS}" >> "$GITHUB_OUTPUT"
            echo "run_smoke_test=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test published images
        if: steps.tags.outputs.run_smoke_test == 'true'
        env:
          ADMIN_API_KEY: smoke-test-key
          FRONTEND_PORT: '18080'
          BACKEND_IMAGE_TAG: ${{ github.sha }}
          FRONTEND_IMAGE_TAG: ${{ github.sha }}
        run: |
          # Always smoke-test the sha tag just built/pushed above, not
          # :latest — that keeps this accurate on every branch, not just main,
          # and avoids racing a concurrent main build that just moved :latest.
          docker pull "${IMAGE_PREFIX}/backend:${BACKEND_IMAGE_TAG}"
          docker pull "${IMAGE_PREFIX}/frontend:${FRONTEND_IMAGE_TAG}"
          ./scripts/smoke-test.sh

  # Both images must finish building before PR-only security checks start.
  trivy-images:
    name: Trivy image (${{ matrix.image }})
    needs: build-and-push
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            digest: ${{ needs.build-and-push.outputs.backend_digest }}
          - image: frontend
            digest: ${{ needs.build-and-push.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scan this run's image, even if another PR build moves its tag.
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ matrix.digest }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          trivyignores: .trivyignore

  trivy-fs:
    # Preserve the existing check name when moving it between workflows.
    needs: build-and-push
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  # Release images are immutable: :X.Y.Z is created once, from the exact
  # :<sha> image that passed the smoke test, and never overwritten.
  # The git tag itself is immutable through the release-tags-immutable ruleset.
  promote-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: promote-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote :<sha> to :<version> (never overwrite)
        env:
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for img in backend frontend; do
            src="${IMAGE_PREFIX}/${img}:${SHA}"
            dst="${IMAGE_PREFIX}/${img}:${VERSION}"
            if docker buildx imagetools inspect "$dst" >/dev/null 2>&1; then
              echo "::error::$dst already exists. Release images are immutable; refusing to overwrite."
              exit 1
            fi
            if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
              echo "::error::$src not found. Tag a commit that CI built on main or dev (normally the release merge commit)."
              exit 1
            fi
          done
          for img in backend frontend; do
            src="${IMAGE_PREFIX}/${img}:${SHA}"
            dst="${IMAGE_PREFIX}/${img}:${VERSION}"
            docker buildx imagetools create --tag "$dst" "$src"
            a=$(docker buildx imagetools inspect "$src" --format '{{json .Manifest.Digest}}')
            b=$(docker buildx imagetools inspect "$dst" --format '{{json .Manifest.Digest}}')
            if [ "$a" != "$b" ]; then
              echo "::error::$dst digest $b differs from $src digest $a"
              exit 1
            fi
            echo "$dst -> $b"
          done
